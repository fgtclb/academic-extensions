name: core12-academics-v2
type: typo3
docroot: public
php_version: "8.1"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
# The instance runs on SQLite, seeded from "sqlite-databases/core-12.sqlite" by
# "config/system/additional.php". No database container is started at all - the
# "database" block below only satisfies DDEV's schema.
database:
    type: mariadb
    version: "11.8"
omit_containers: [db]
use_dns_when_possible: true
timezone: Europe/Berlin
composer_version: "2"
web_environment: []
corepack_enable: false
hooks:
    post-start:
        # Forward the host SSH agent first: "composer install" below resolves
        # packages that may come from private VCS remotes.
        - exec-host: ddev auth ssh
        - composer: install
        # The caches outlive the code they were built from: after a release, a
        # branch switch or a pull, the dependency injection container and the
        # page cache still describe the previous state, which shows as a fatal
        # error or a page linking files that are gone. Only with a database:
        # while an instance is rebuilt from nothing the seeding is suppressed,
        # and a TYPO3 command would then leave an empty database file behind.
        - exec: '[ ! -f var/sqlite/core-12.sqlite ] || vendor/bin/typo3 cache:flush'
