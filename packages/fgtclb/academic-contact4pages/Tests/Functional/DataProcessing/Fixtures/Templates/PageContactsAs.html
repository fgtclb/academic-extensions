<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<div class="page-contacts">
    <p>TOP-LEVEL-COUNT:{contacts -> f:count()}</p>
    <p>TOP-LEVEL-ROLES:{roles -> f:count()}</p>
    <p>COUNT:{pageContacts.contacts -> f:count()}</p>

    <f:for each="{pageContacts.roles}" as="role">
        <p>ROLE:{role.name}</p>
    </f:for>

    <f:for each="{pageContacts.contacts}" as="contact">
        <p>CONTACT:{contact.contract.profile.lastName}</p>
    </f:for>

    <f:for each="{pageContacts.contactsWithoutRole}" as="contact">
        <p>WITHOUT-ROLE:{contact.contract.profile.lastName}</p>
    </f:for>
</div>

</html>
