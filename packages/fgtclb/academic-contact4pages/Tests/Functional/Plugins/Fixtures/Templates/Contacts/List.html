<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>
<f:comment>
    An integrator's list template that renders the content element header through the header
    partial of EXT:fluid_styled_content, which requires "record" on TYPO3 v14.
</f:comment>
<div class="list-override">
    <f:render partial="Header/All" arguments="{_all}" />
    <p>RECORD-UID[{record.uid}]</p>
</div>
</html>
