services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicContacts4pages\:
    resource: '../Classes'
    exclude:
      - '../Classes/Domain/Model'

  # Instantiated by the DataHandler through GeneralUtility::makeInstance(), which
  # resolves a public service from the container - constructor injection needs it.
  FGTCLB\AcademicContacts4pages\Hook\ContactSortingHook:
    public: true
