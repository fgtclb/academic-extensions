<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<div class="academic-programs-list">
    <f:if condition="{data.CType} == 'academicprograms_studyfinder'">
        <f:then>
            <f:render
                partial="Program/StudyFinder"
                arguments="{_all}"
            />
        </f:then>
        <f:else>
            <f:render
                partial="Program/SortingAndFilters"
                arguments="{_all}"
            />
            <f:render
                partial="Program/ItemList"
                arguments="{_all}"
            />
        </f:else>
    </f:if>
</div>


</html>
