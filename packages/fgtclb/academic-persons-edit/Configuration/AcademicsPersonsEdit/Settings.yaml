# Central, section-based configuration for frontend-editable profile fields,
# special inline components, contract contacts and structured document
# collections. The public detail layout is configured independently in
# academic_persons/Configuration/AcademicPersons/Settings.yaml.
#
# Important:
# - Map order is preserved and controls presentation in the inline profile
#   view, including document sections and fields.
# - Settings from active packages are merged only at the top level. A site
#   package overriding one of the maps below must therefore repeat the complete
#   map it wants to keep.
# - Flush the TYPO3 caches after changing this file so the typed settings graph
#   is rebuilt.
#
# Validator flags are section-local. Common flags are `required`, `readonly`,
# `disabled`, `email`, `url`, `number`, `tel`, `date`, `textarea` and `html`.
# Profile fields
# --------------
# The map key is the stable field identifier.
# - `section` groups the field into the matching visual template section.
# - `fieldType` describes the field kind for frontend normalization.
# - `renderType` controls the inline editor presentation/input metadata.
# - `validators` applies only to this field inside its declared section.
profile:
  gender:
    section: information
    fieldType: select
    renderType: select
    validators:
      - required
  # Academic or honorific prefix. Do not confuse this direct Profile property
  # with `special.title`, which is the composed display name.
  title:
    section: information
    fieldType: input
    renderType: text
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  # These name fields are normally synchronized from the frontend user and
  # are deliberately not writable through inline editing.
  firstName:
    section: information
    fieldType: input
    renderType: text
    validators:
      - readonly
      - disabled
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  middleName:
    section: information
    fieldType: input
    renderType: text
    validators:
      - readonly
      - disabled
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  lastName:
    section: information
    fieldType: input
    renderType: text
    validators:
      - readonly
      - disabled
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  # `combinedLink` edits the URL together with its companion title property
  # (`websiteTitle` or `publicationsLinkTitle`).
  website:
    section: information
    fieldType: input
    renderType: combinedLink
    validators:
      - url
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  publicationsLink:
    section: information
    fieldType: input
    renderType: combinedLink
    validators:
      - url
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  # The `ckeditor` render type selects sanitized rich-text handling; the `html`
  # flag keeps the matching validation/input metadata explicit.
  coreCompetences:
    section: information
    fieldType: textarea
    renderType: ckeditor
    validators:
      - html
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  supervisedThesis:
    section: information
    fieldType: textarea
    renderType: ckeditor
    validators:
      - html
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  supervisedDoctoralThesis:
    section: information
    fieldType: textarea
    renderType: ckeditor
    validators:
      - html
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  teachingArea:
    section: information
    fieldType: textarea
    renderType: ckeditor
    validators:
      - html
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  # `aboutme` mirrors the separate About-me section in the inline templates.
  miscellaneous:
    section: aboutme
    fieldType: textarea
    renderType: ckeditor
    characterLimit: 500
    validators:
      - html
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
# Special inline components
# -------------------------
# These entries are not ordinary rows generated from one Profile property.
# `Index.html` decides where they are placed. Their render type selects the
# dedicated Fluid/JavaScript module; no layout information belongs here.
special:
  # The page title is the composed profile name. `fields` is also the single
  # source used by JavaScript to re-render it after an inline name update.
  title:
    type: special
    renderType: title
    fields:
      - title
      - firstName
      - middleName
      - lastName
  image:
    type: special
    renderType: cropper
    settings:
      ratio: 1x1
  skipSync:
    type: special
    fieldType: check
    renderType: checkbox
    helptext: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
# Contract contact fields
# -----------------------
# These fields belong to Address, Email and PhoneNumber records below a
# Contract. They intentionally do not take part in Profile validation or in the
# generic Profile JSON endpoint. `propertyName` is only needed where the public
# field identifier differs from the DTO/domain property.
contractContact:
  phoneNumber:
    section: phoneNumbers
    fieldType: input
    renderType: phone
    validators:
      - required
      - tel
  phoneNumberType:
    section: phoneNumbers
    propertyName: type
    fieldName: type
    fieldType: select
    renderType: select
  emailAddress:
    section: emailAddresses
    propertyName: email
    fieldName: email
    fieldType: input
    renderType: email
    validators:
      - required
      - email
  emailAddressType:
    section: emailAddresses
    propertyName: type
    fieldName: type
    fieldType: select
    renderType: select
  street:
    section: physicalAddresses
    fieldType: input
    renderType: text
    validators:
      - required
  streetNumber:
    section: physicalAddresses
    fieldType: input
    renderType: text
    validators:
      - required
  additional:
    section: physicalAddresses
    fieldType: input
    renderType: text
  zip:
    section: physicalAddresses
    fieldType: input
    renderType: text
    validators:
      - required
  city:
    section: physicalAddresses
    fieldType: input
    renderType: text
    validators:
      - required
  state:
    section: physicalAddresses
    fieldType: input
    renderType: text
  country:
    section: physicalAddresses
    fieldType: input
    renderType: text
    validators:
      - required
  physicalAddressType:
    section: physicalAddresses
    propertyName: type
    fieldName: type
    fieldType: select
    renderType: select
# Document sections
# -----------------
# Each key is a stable section identifier and the order is the display order.
# - `label` is the LLL reference used for the section heading.
# - `type` is the ProfileInformation discriminator. `contracts` is the reserved
#   marker for the special Contract entity section.
# - `fieldName` is the exact Profile relation/database field. Collection
#   relations are plural; underscored names are converted to their getter.
# - `readonly` disables all mutating frontend actions for the section.
# - `rowFields` selects and orders the values rendered in each compact row.
#   ProfileInformation supports `from`, `to`, `year`, `title` and
#   `description`; Contract supports `from`, `to` and `position`.
# - `actions` selects and orders the available per-row actions. Supported
#   values are `view`, `down`, `up`, `delete` and `edit`.
# - `validators` belongs exclusively to records of the containing section.
# Document validation aliases:
# - `from` -> DTO `yearStart` -> native DATE field `year_start`
# - `to` -> DTO `yearEnd` -> native DATE field `year_end`
# - `year` keeps its legacy property name but stores a complete native DATE.
# - `description` -> DTO `bodytext` -> database field `bodytext`
documentSections:
  # Contracts use their own Contract model rather than ProfileInformation.
  # The relation is Profile::$contracts / Profile::getContracts(), whereas
  # `contract` denotes one individual item or form argument.
  contracts:
    label: "LLL:EXT:academic_persons/Resources/Private/Language/locallang_tca.xlf:tx_academicpersons_domain_model_profile.columns.contracts.label"
    type: contracts
    fieldName: contracts
    readonly: true
    rowFields:
      - from
      - position
    actions:
      - view
  # All following sections contain ProfileInformation records. Their `type`
  # selects the records and their `fieldName` selects the Profile collection.
  cooperation:
    label: "LLL:EXT:academic_persons/Resources/Private/Language/locallang_tca.xlf:tx_academicpersons_domain_model_profile.columns.cooperation.label"
    type: cooperation
    fieldName: cooperation
    rowFields:
      - from
      - to
      - title
    actions:
      - view
      - down
      - up
      - delete
      - edit
    validators:
      title:
        - required
      from:
        - date
      to:
        - date
      year:
        - required
        - date
      description:
        editor:
          limit: 100
          type: ckeditor
    helptext:
      title: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      from: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      to: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      year: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      description: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
  lectures:
    label: "LLL:EXT:academic_persons/Resources/Private/Language/locallang_tca.xlf:tx_academicpersons_domain_model_profile.columns.lectures.label"
    type: lecture
    fieldName: lectures
    rowFields:
      - year
      - title
    actions:
      - view
      - down
      - up
      - delete
      - edit
    validators:
      title:
        - required
      link:
        - url
      from:
        - date
      to:
        - date
      year:
        - required
        - date
      description:
        editor:
          limit: 100
          type: ckeditor
    helptext:
      title: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      from: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      to: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      year: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
      description: "LLL:EXT:academic_persons_edit/Resources/Private/Language/locallang.xlf:list.noTranslationFound"
