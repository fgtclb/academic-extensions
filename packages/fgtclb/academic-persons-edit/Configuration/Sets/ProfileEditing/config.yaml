# Compatibility set for retained ProfileEditing records.
#
# "typoscript" points at the folder that "Configuration/TCA/Overrides/sys_template.php"
# registers as a static template, and "pagets" at the file that
# "Configuration/TCA/Overrides/pages.php" registers - there is exactly one
# physical copy of each, so the two delivery mechanisms can never drift apart.
# The page TSconfig path is retained for existing site references but is a
# deliberate no-op; it never exposes the legacy CType.
name: fgtclb/academic-persons-edit-profile-editing
label: 'Academic Persons Edit: Profile editing compatibility'
dependencies:
  - fgtclb/academic-base-ctype-group
typoscript: 'EXT:academic_persons_edit/Configuration/TypoScript/ProfileEditing/'
pagets: 'EXT:academic_persons_edit/Configuration/TSconfig/ProfileEditing/page.tsconfig'
