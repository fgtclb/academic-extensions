<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:if condition="{profile}">
        <f:then>
            <f:asset.module
                identifier="@fgtclb/academic-persons-edit/frontend/profile.js?t={f:format.date(format: '%s', date: 'now')}" />
            <f:asset.css
                identifier="academics-personal-edit-additional-css"
                href="EXT:academic_persons_edit/Resources/Public/Css/additional.css" />
            <f:variable
                name="updateUrl"
                value="{f:uri.action(action: 'update', controller: 'InlineProfile', pageType: 1733735, absolute: true)}" />
            <f:variable
                name="skipSyncUrl"
                value="{f:uri.action(action: 'updateSkipSync', controller: 'InlineProfile', pageType: 1733735, absolute: true)}" />
            <f:variable
                name="deleteImageUrl"
                value="{f:uri.action(action: 'deleteImage', controller: 'InlineProfile', pageType: 1733735, absolute: true)}" />
            <f:variable
                name="placeholderImageUrl"
                value="{f:uri.resource(path: 'Images/profile-placeholder.png')}" />

            <div
                class="academic-persons-inline-edit container-fluid px-0"
                data-academic-persons-inline-edit
                data-update-url="{updateUrl}"
                data-skip-sync-url="{skipSyncUrl}"
                data-delete-image-url="{deleteImageUrl}"
                data-placeholder-image-url="{placeholderImageUrl}"
                data-placeholder-image-alt="{f:translate(key: 'profile.image.placeholder.alt', extensionName: 'academic_persons_edit')}"
                data-has-image="{f:if(condition: profile.image, then: '1', else: '0')}"
                data-profile-uid="{profile.uid}"
                data-message-saving="{f:translate(key: 'inlineProfile.status.saving', extensionName: 'academic_persons_edit')}"
                data-message-success-message="{f:translate(key: 'inlineProfile.status.success.message', extensionName: 'academic_persons_edit')}"
                data-message-error-message="{f:translate(key: 'inlineProfile.status.error.message', extensionName: 'academic_persons_edit')}"
                data-message-error-title="{f:translate(key: 'inlineProfile.status.error.title', extensionName: 'academic_persons_edit')}"
                data-message-success-title="{f:translate(key: 'inlineProfile.status.success.title', extensionName: 'academic_persons_edit')}"
                data-message-info-title="{f:translate(key: 'inlineProfile.status.info.title', extensionName: 'academic_persons_edit')}"
                data-message-info-message="{f:translate(key: 'inlineProfile.status.info.message', extensionName: 'academic_persons_edit')}"
                data-message-warning-title="{f:translate(key: 'inlineProfile.status.warning.title', extensionName: 'academic_persons_edit')}"
                data-message-validation="{f:translate(key: 'inlineProfile.status.validation', extensionName: 'academic_persons_edit')}"
                data-message-editor-error="{f:translate(key: 'inlineProfile.status.editorError', extensionName: 'academic_persons_edit')}"
                data-message-unchanged="{f:translate(key: 'inlineProfile.status.unchanged', extensionName: 'academic_persons_edit')}"
                data-message-image-uploaded="{f:translate(key: 'inlineProfile.image.status.uploaded', extensionName: 'academic_persons_edit')}"
                data-message-image-upload-missing="{f:translate(key: 'inlineProfile.image.status.missing', extensionName: 'academic_persons_edit')}"
                data-message-image-deleted="{f:translate(key: 'inlineProfile.image.status.deleted', extensionName: 'academic_persons_edit')}">
                <div class="container-fluid px-0">
                    <div class="row gx-lg-5 gy-5 align-items-stretch">
                        <div class="col-12 col-lg-4">
                            <div class="sticky-top" data-ie-sticky-image>
                                <f:render
                                    partial="InlineProfile/Image/Card"
                                    arguments="{profile: profile}" />
                            </div>
                        </div>
                        <div class="col-12 col-lg-8">
                            <f:render
                                partial="InlineProfile/Forms/Profile"
                                arguments="{profile: profile, validations: validations, genderOptions: genderOptions}" />
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="mt-5">
                                <f:render
                                    partial="InlineProfile/Forms/Content"
                                    arguments="{profile: profile, validations: validations}" />
                            </div>
                        </div>
                    </div>
                </div>

                <f:render
                    partial="InlineProfile/Image/Modal"
                    arguments="{profile: profile, imageAllowedMimeTypes: imageAllowedMimeTypes}" />
                <f:render partial="InlineProfile/StatusToast" />
                <f:render partial="InlineProfile/ButtonTemplates" />
            </div>
        </f:then>
        <f:else>
            <div class="alert alert-info" role="status">
                <f:translate
                    key="inlineProfile.noProfile"
                    extensionName="academic_persons_edit" />
            </div>
        </f:else>
    </f:if>
</html>
