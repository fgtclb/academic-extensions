<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:p="http://typo3.org/ns/FGTCLB/AcademicPersons/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:variable name="validation"
        ><p:validationEnsure
            validations="{validations}"
            identifier="{identifier}"
    /></f:variable>

    <f:variable
        name="elementId"
        value="inline-profile-{profile.uid}-{identifier}"
    />
    <f:variable name="resolvedInputType" value="text" />
    <f:if condition="{validation.inputType}">
        <f:variable name="resolvedInputType" value="{validation.inputType}" />
    </f:if>
    <f:if condition="{inputType}">
        <f:variable name="resolvedInputType" value="{inputType}" />
    </f:if>

    <div class="{columnClass}">
        <div class="mb-3">
            <label class="form-label" for="{elementId}">
                {f:translate(key: 'profile.{identifier}.label', extensionName:
                'academic_persons_edit')}
                <f:if condition="{validation.required}">
                    <abbr title="required">*</abbr>
                </f:if>
            </label>
            <div class="clearfix" data-form-field-button-area>
                <f:if condition="{profile.{identifier}}">
                    <f:then>
                        <f:if condition="{validation.disabled} || {validation.readOnly}">
                            <f:then>
                                <button
                                    class="btn btn-outline-secondary btn-sm text-truncate overflow-x-hidden mw-100"
                                    disabled
                                    type="button"
                                >
                                    {profile.{identifier}}
                                </button>
                            </f:then>
                            <f:else>
                                <button
                                    class="btn btn-outline-dark btn-sm text-truncate overflow-x-hidden mw-100"
                                    data-academic-persons-inline-edit-activate-btn
                                    data-ie-for="{elementId}"
                                    type="button"
                                >
                                    {profile.{identifier}}
                                </button>
                            </f:else>
                        </f:if>
                    </f:then>
                    <f:else if="!{validation.disabled} && !{validation.readOnly}">
                        <button
                            class="btn btn-outline-success btn-sm text-truncate overflow-x-hidden mw-100"
                            data-academic-persons-inline-edit-activate-btn
                            data-ie-for="{elementId}"
                            type="button"
                        >
                            +
                        </button>
                    </f:else>
                </f:if>
            </div>
            <div class="d-flex flex-row gap-2">
                <f:if condition="{textarea}">
                    <f:then>
                        <f:form.textarea
                            name="{identifier}"
                            id="{elementId}"
                            value="{profile.{identifier}}"
                            class="d-none form-control form-control-sm academic-persons-inline-edit__field"
                            rows="{rows}"
                            disabled="{validation.disabled ? 'disabled' : ''}"
                            required="{validation.required ? 'required' : ''}"
                            readonly="{validation.readOnly ? 'readonly' : ''}"
                        />
                    </f:then>
                    <f:else>
                        <f:form.textfield
                            name="{identifier}"
                            id="{elementId}"
                            value="{profile.{identifier}}"
                            type="{resolvedInputType}"
                            class="d-none form-control form-control-sm academic-persons-inline-edit__field"
                            disabled="{validation.disabled ? 'disabled' : ''}"
                            required="{validation.required ? 'required' : ''}"
                            readonly="{validation.readOnly ? 'readonly' : ''}"
                            autocomplete="{autocomplete}"
                        />
                    </f:else>
                </f:if>
                <button
                    class="btn btn-outline-danger btn-sm d-none"
                    data-ie-dismiss
                    data-ie-for="{elementId}"
                    type="reset"
                >
                    X
                </button>
                <button
                    class="btn btn-success btn-sm d-none"
                    data-ie-save
                    data-ie-for="{elementId}"
                    type="submit"
                >
                    ✓
                </button>
            </div>
            <div class="invalid-feedback"></div>
        </div>
    </div>
</html>
