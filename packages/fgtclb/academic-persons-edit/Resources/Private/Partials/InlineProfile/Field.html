<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable
        name="elementId"
        value="inline-profile-{profile.uid}-{field.identifier}" />
    <div class="col-12">
        <div class="rounded-1 p-3 p-lg-4 {rowClass}" data-ie-field-wrapper>
            <f:render
                partial="InlineProfile/Field/Preview"
                arguments="{
                    profile: profile,
                    field: field,
                    elementId: elementId,
                    richText: richText
                }" />
            <div
                id="{elementId}-editor"
                class="d-none mt-3"
                data-ie-field-editor
                data-ie-for="{elementId}">
                <label class="form-label fw-semibold" for="{elementId}">
                    <f:translate
                        key="profile.{field.identifier}.label"
                        extensionName="academic_persons_edit" />
                    <f:if condition="{field.validation.required}">
                        <abbr title="required">*</abbr>
                    </f:if>
                </label>
                <div
                    class="d-flex flex-column flex-xl-row gap-2 align-items-start">
                    <f:render
                        partial="InlineProfile/Field/Control"
                        arguments="{
                            profile: profile,
                            field: field,
                            elementId: elementId,
                            textarea: textarea,
                            richText: richText,
                            rows: rows
                        }" />
                    <f:if
                        condition="!{field.validation.disabled} && !{field.validation.readOnly}">
                        <f:render
                            partial="InlineProfile/Field/Actions"
                            arguments="{elementId: elementId}" />
                    </f:if>
                </div>
                <div class="invalid-feedback"></div>
            </div>
        </div>
    </div>
</html>
