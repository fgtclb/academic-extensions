<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:p="http://typo3.org/ns/FGTCLB/AcademicPersons/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable name="validation"
        ><p:validationEnsure
            validations="{validations}"
            identifier="{identifier}"
    /></f:variable>
    <f:variable
        name="elementId"
        value="inline-profile-{profile.uid}-{identifier}" />
    <f:variable name="resolvedInputType" value="text" />
    <f:if condition="{validation.inputType}">
        <f:variable name="resolvedInputType" value="{validation.inputType}" />
    </f:if>
    <f:if condition="{inputType}">
        <f:variable name="resolvedInputType" value="{inputType}" />
    </f:if>

    <div class="{columnClass}">
        <div class="mb-3">
            <label class="form-label" for="{elementId}">
                {f:translate(key: 'profile.{identifier}.label', extensionName:
                'academic_persons_edit')}
                <f:if condition="{validation.required}">
                    <abbr title="required">*</abbr>
                </f:if>
            </label>

            <f:render
                partial="InlineProfile/Field/Preview"
                arguments="{
                    profile: profile,
                    identifier: identifier,
                    elementId: elementId,
                    validation: validation,
                    richText: richText
                }" />

            <div class="d-flex flex-column flex-md-row gap-2 align-items-start">
                <f:render
                    partial="InlineProfile/Field/Control"
                    arguments="{
                        profile: profile,
                        identifier: identifier,
                        elementId: elementId,
                        validation: validation,
                        resolvedInputType: resolvedInputType,
                        autocomplete: autocomplete,
                        textarea: textarea,
                        richText: richText,
                        rows: rows
                    }" />
                <f:if
                    condition="!{validation.disabled} && !{validation.readOnly}">
                    <f:render
                        partial="InlineProfile/Field/Actions"
                        arguments="{elementId: elementId}" />
                </f:if>
            </div>
            <div class="invalid-feedback"></div>
        </div>
    </div>
</html>
