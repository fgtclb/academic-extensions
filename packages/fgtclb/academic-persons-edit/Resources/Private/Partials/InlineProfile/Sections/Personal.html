<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:render
        partial="InlineProfile/Field/Gender"
        arguments="{
            profile: profile,
            validations: validations,
            genderOptions: genderOptions,
            columnClass: 'col-12',
            rowClass: 'bg-body-tertiary'
        }" />
    <f:render
        partial="InlineProfile/Field/Group"
        arguments="{
            profile: profile,
            validations: validations,
            identifier: 'name',
            labelKey: 'profile.name.label',
            displayValue: '{profile.title} {profile.firstName} {profile.middleName} {profile.lastName}',
            fieldIds: 'inline-profile-{profile.uid}-title inline-profile-{profile.uid}-firstName inline-profile-{profile.uid}-middleName inline-profile-{profile.uid}-lastName',
            displayFieldIds: 'inline-profile-{profile.uid}-title inline-profile-{profile.uid}-firstName inline-profile-{profile.uid}-middleName inline-profile-{profile.uid}-lastName',
            displayMode: 'join',
            fields: {
                0: {identifier: 'title', autocomplete: 'honorific-prefix', columnClass: 'col-12 col-sm-4'},
                1: {identifier: 'firstName', autocomplete: 'given-name', columnClass: 'col-12 col-sm-8'},
                2: {identifier: 'middleName', autocomplete: 'additional-name', columnClass: 'col-12 col-sm-6'},
                3: {identifier: 'lastName', autocomplete: 'family-name', columnClass: 'col-12 col-sm-6'}
            },
            columnClass: 'col-12'
        }" />
</html>
