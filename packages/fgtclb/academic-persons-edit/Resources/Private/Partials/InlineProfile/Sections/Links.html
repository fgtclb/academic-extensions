<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:render
        partial="InlineProfile/Field/Group"
        arguments="{
            profile: profile,
            validations: validations,
            identifier: 'website',
            labelKey: 'profile.website.label',
            displayValue: '{f:if(condition: profile.websiteTitle, then: profile.websiteTitle, else: profile.website)}',
            fieldIds: 'inline-profile-{profile.uid}-website inline-profile-{profile.uid}-websiteTitle',
            displayFieldIds: 'inline-profile-{profile.uid}-websiteTitle inline-profile-{profile.uid}-website',
            displayMode: 'first',
            fields: {
                0: {identifier: 'website', autocomplete: 'url', inputType: 'url', columnClass: 'col-12'},
                1: {identifier: 'websiteTitle', columnClass: 'col-12'}
            },
            columnClass: 'col-12',
            rowClass: 'bg-body-tertiary'
        }" />
    <f:render
        partial="InlineProfile/Field/Group"
        arguments="{
            profile: profile,
            validations: validations,
            identifier: 'publications',
            labelKey: 'profile.publicationsLink.label',
            displayValue: '{f:if(condition: profile.publicationsLinkTitle, then: profile.publicationsLinkTitle, else: profile.publicationsLink)}',
            fieldIds: 'inline-profile-{profile.uid}-publicationsLink inline-profile-{profile.uid}-publicationsLinkTitle',
            displayFieldIds: 'inline-profile-{profile.uid}-publicationsLinkTitle inline-profile-{profile.uid}-publicationsLink',
            displayMode: 'first',
            fields: {
                0: {identifier: 'publicationsLink', autocomplete: 'url', inputType: 'url', columnClass: 'col-12'},
                1: {identifier: 'publicationsLinkTitle', columnClass: 'col-12'}
            },
            columnClass: 'col-12'
        }" />
</html>
