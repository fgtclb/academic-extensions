<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div data-ie-document-sections>
        <f:variable
            name="defaultEmptyMessage"
            value="{f:translate(
                key: 'inlineProfile.documents.empty',
                extensionName: 'academic_persons_edit',
            )}" />
        <f:for each="{sections}" as="section">
            <section
                class="mt-5 pt-lg-3"
                aria-labelledby="inline-profile-{profile.uid}-document-section-{section.identifier}-heading"
                data-ie-document-section
                data-section-key="{section.identifier}"
                data-section-field-name="{section.fieldName}"
                data-section-record-type="{section.type}"
                data-section-readonly="{f:if(condition: section.readOnly, then: '1', else: '0')}"
                data-section-position="{section.position}">
                <h2
                    id="inline-profile-{profile.uid}-document-section-{section.identifier}-heading"
                    class="display-6 fw-normal mb-4">
                    <f:translate
                        key="{section.label}"
                        default="{section.identifier}" />
                </h2>
                <f:if condition="{section.items}">
                    <f:then>
                        <f:switch expression="{section.kind}">
                            <f:case value="contract">
                                <f:render
                                    partial="InlineProfile/Documents/Contract"
                                    arguments="{items: section.items}" />
                            </f:case>
                            <f:case value="profileInformation">
                                <f:render
                                    partial="InlineProfile/Documents/ProfileInformation"
                                    arguments="{items: section.items, dateMode: section.dateMode}" />
                            </f:case>
                        </f:switch>
                    </f:then>
                    <f:else>
                        <div
                            class="bg-body-tertiary rounded-1 px-3 px-lg-4 py-4"
                            data-ie-document-empty-state>
                            <f:translate
                                key="inlineProfile.documents.empty.{section.identifier}"
                                extensionName="academic_persons_edit"
                                default="{defaultEmptyMessage}" />
                        </div>
                    </f:else>
                </f:if>
            </section>
        </f:for>
    </div>
</html>
