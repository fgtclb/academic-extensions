<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <section
        aria-labelledby="inline-profile-{profile.uid}-personal-heading"
        data-profile-section="{section.identifier}">
        <h2
            id="inline-profile-{profile.uid}-personal-heading"
            class="h2 fw-normal mb-4">
            <f:translate
                key="inlineProfile.section.personal"
                extensionName="academic_persons_edit" />
        </h2>
        <form class="academic-persons-inline-edit__form" data-ie-fields-form>
            <fieldset class="border-0 p-0 m-0">
                <legend class="visually-hidden">
                    <f:translate
                        key="inlineProfile.section.personal"
                        extensionName="academic_persons_edit" />
                </legend>
                <div class="row g-3">
                    <f:render
                        partial="InlineProfile/Profile/Fields"
                        arguments="{profile: profile, items: section.items, fieldOptions: fieldOptions}" />
                </div>
            </fieldset>
        </form>
    </section>
</html>
