<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <form
        class="academic-persons-inline-edit__form mt-5 pt-lg-3"
        data-ie-fields-form
        data-ie-content-fields-form>
        <section aria-labelledby="inline-profile-{profile.uid}-about-heading">
            <h2
                id="inline-profile-{profile.uid}-about-heading"
                class="display-6 fw-normal mb-4">
                <f:translate
                    key="inlineProfile.section.about"
                    extensionName="academic_persons_edit" />
            </h2>
            <div class="row g-3">
                <f:render
                    partial="InlineProfile/Field"
                    arguments="{
                        profile: profile,
                        validations: validations,
                        identifier: 'miscellaneous',
                        labelKey: 'inlineProfile.about.description',
                        textarea: true,
                        richText: true,
                        rows: 8,
                        columnClass: 'col-12',
                        rowClass: 'bg-body-tertiary'
                    }" />
            </div>
        </section>
    </form>
</html>
