<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:if condition="{textarea}">
        <f:then>
            <f:if condition="{richText}">
                <f:then>
                    <div
                        class="d-none flex-grow-1 w-100"
                        data-ie-editor-container>
                        <f:form.textarea
                            name="{identifier}"
                            id="{elementId}"
                            value="{profile.{identifier}}"
                            class="form-control form-control-sm academic-persons-inline-edit__field"
                            rows="{rows}"
                            disabled="{validation.disabled ? 'disabled' : ''}"
                            required="{validation.required ? 'required' : ''}"
                            readonly="{validation.readOnly ? 'readonly' : ''}"
                            data-ie-rich-text="true" />
                    </div>
                </f:then>
                <f:else>
                    <f:form.textarea
                        name="{identifier}"
                        id="{elementId}"
                        value="{profile.{identifier}}"
                        class="d-none flex-grow-1 w-100 form-control form-control-sm academic-persons-inline-edit__field"
                        rows="{rows}"
                        disabled="{validation.disabled ? 'disabled' : ''}"
                        required="{validation.required ? 'required' : ''}"
                        readonly="{validation.readOnly ? 'readonly' : ''}" />
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <f:form.textfield
                name="{identifier}"
                id="{elementId}"
                value="{profile.{identifier}}"
                type="{resolvedInputType}"
                class="d-none flex-grow-1 w-100 form-control form-control-sm academic-persons-inline-edit__field"
                disabled="{validation.disabled ? 'disabled' : ''}"
                required="{validation.required ? 'required' : ''}"
                readonly="{validation.readOnly ? 'readonly' : ''}"
                autocomplete="{autocomplete}" />
        </f:else>
    </f:if>
</html>
