<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:switch expression="{field.renderType}">
        <f:case value="select">
            <f:render
                partial="InlineProfile/Field/Types/Select"
                arguments="{profile: profile, field: field, options: options, rowClass: rowClass}" />
        </f:case>
        <f:case value="checkbox">
            <f:render
                partial="InlineProfile/Field/Types/Checkbox"
                arguments="{profile: profile, field: field, rowClass: rowClass}" />
        </f:case>
        <f:case value="combinedLink">
            <f:render
                partial="InlineProfile/Field/Types/CombinedLink"
                arguments="{profile: profile, field: field, rowClass: rowClass}" />
        </f:case>
        <f:case value="ckeditor">
            <f:render
                partial="InlineProfile/Field/Types/Ckeditor"
                arguments="{profile: profile, field: field, rowClass: rowClass}" />
        </f:case>
        <f:case value="textarea">
            <f:render
                partial="InlineProfile/Field/Types/Textarea"
                arguments="{profile: profile, field: field, rowClass: rowClass}" />
        </f:case>
        <f:defaultCase>
            <f:render
                partial="InlineProfile/Field/Types/Input"
                arguments="{profile: profile, field: field, rowClass: rowClass}" />
        </f:defaultCase>
    </f:switch>
</html>
