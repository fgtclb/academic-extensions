<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div class="clearfix" data-form-field-button-area>
        <f:if condition="{richText}">
            <f:then>
                <div
                    class="d-flex align-items-start gap-2"
                    data-ie-rich-text-preview
                    data-ie-for="{elementId}"
                    data-empty-label="{f:translate(key: 'inlineProfile.content.empty', extensionName: 'academic_persons_edit')}">
                    <div
                        class="flex-grow-1 border border-muted border-1 rounded p-2"
                        data-ie-rich-text-preview-content>
                        <f:if condition="{profile.{identifier}}">
                            <f:then>
                                {profile.{identifier} -> f:format.html()}
                            </f:then>
                            <f:else>
                                <span class="text-body-secondary">
                                    <f:translate
                                        key="inlineProfile.content.empty"
                                        extensionName="academic_persons_edit" />
                                </span>
                            </f:else>
                        </f:if>
                    </div>
                    <f:if
                        condition="!{validation.disabled} && !{validation.readOnly}">
                        <button
                            class="btn btn-outline-secondary btn-sm flex-shrink-0"
                            data-academic-persons-inline-edit-activate-btn
                            data-ie-for="{elementId}"
                            type="button"
                            title="{f:translate(key: 'actions.edit', extensionName: 'academic_persons_edit')}"
                            aria-label="{f:translate(key: 'actions.edit', extensionName: 'academic_persons_edit')}">
                            <core:icon
                                identifier="academic-persons-inline-edit-pencil"
                                size="small"
                                alternativeMarkupIdentifier="inline" />
                        </button>
                    </f:if>
                </div>
            </f:then>
            <f:else>
                <f:if condition="{profile.{identifier}}">
                    <f:then>
                        <f:if
                            condition="{validation.disabled} || {validation.readOnly}">
                            <f:then>
                                <button
                                    class="btn btn-outline-secondary btn-sm text-truncate overflow-x-hidden mw-100"
                                    disabled
                                    type="button">
                                    <span data-ie-button-label
                                        >{profile.{identifier}}</span
                                    >
                                </button>
                            </f:then>
                            <f:else>
                                <button
                                    class="btn btn-outline-dark btn-sm text-truncate overflow-x-hidden mw-100"
                                    data-academic-persons-inline-edit-activate-btn
                                    data-ie-for="{elementId}"
                                    type="button">
                                    <span data-ie-button-label
                                        >{profile.{identifier}}</span
                                    >
                                </button>
                            </f:else>
                        </f:if>
                    </f:then>
                    <f:else
                        if="!{validation.disabled} && !{validation.readOnly}">
                        <button
                            class="btn btn-outline-success btn-sm text-truncate overflow-x-hidden mw-100"
                            data-academic-persons-inline-edit-activate-btn
                            data-ie-for="{elementId}"
                            type="button">
                            <span data-ie-button-label class="fs-5 lh-1">
                                <core:icon
                                    identifier="academic-persons-inline-edit-add"
                                    size="small"
                                    alternativeMarkupIdentifier="inline" />
                            </span>
                        </button>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </div>
</html>
