<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <article
        class="row g-3 align-items-start rounded-1 px-3 px-lg-4 py-4 {f:if(condition: itemIteration.isOdd, then: 'bg-body-tertiary')}"
        data-ie-document-item
        data-item-uid="{item.uid}"
        data-item-sorting="{item.sorting}"
        data-item-position="{itemIteration.index}">
        <f:for each="{rowFields}" as="rowField">
            <f:switch expression="{rowField}">
                <f:case value="from">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.from" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="yearStart">
                            <f:render partial="InlineProfile/Documents/DateValue" arguments="{value: item.yearStart, fallback: item.year}" />
                        </div>
                    </div>
                </f:case>
                <f:case value="to">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.to" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="yearEnd">
                            <f:render partial="InlineProfile/Documents/DateValue" arguments="{value: item.yearEnd}" />
                        </div>
                    </div>
                </f:case>
                <f:case value="year">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.year" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="year">
                            <f:render partial="InlineProfile/Documents/DateValue" arguments="{value: item.year, fallback: item.yearStart}" />
                        </div>
                    </div>
                </f:case>
                <f:case value="title">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.title" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-title>
                            <f:if condition="{item.link}">
                                <f:then>
                                    <f:link.typolink parameter="{item.link}" target="_blank" absolute="true">{item.title}</f:link.typolink>
                                </f:then>
                                <f:else><span>{item.title}</span></f:else>
                            </f:if>
                        </div>
                    </div>
                </f:case>
                <f:case value="description">
                    <div class="col-12">
                        <div class="fw-semibold">
                            <f:translate key="profileInformation.bodytext.label" extensionName="academic_persons_edit" />
                        </div>
                        <div class="{f:if(condition: item.bodytext, else: 'd-none')}" data-ie-document-value="bodytext">
                            {item.bodytext -> f:format.html()}
                        </div>
                    </div>
                </f:case>
            </f:switch>
        </f:for>
        <f:render partial="InlineProfile/Documents/Actions" arguments="{actions: actions, sortable: sortable}" />
    </article>
</html>
