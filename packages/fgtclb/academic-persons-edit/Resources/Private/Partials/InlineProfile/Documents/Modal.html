<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div
        class="modal fade rounded-0"
        tabindex="-1"
        aria-hidden="true"
        data-ie-document-modal>
        <div
            class="modal-dialog modal-dialog-centered modal-dialog-scrollable rounded-0">
            <form class="modal-content rounded-0" data-ie-document-form>
                <div
                    class="modal-header d-flex flex-row justify-content-between rounded-0">
                    <h2
                        class="modal-title fs-5"
                        data-ie-document-modal-title></h2>
                    <button
                        type="button"
                        class="btn-close rounded-0"
                        data-bs-dismiss="modal"
                        aria-label="{f:translate(key: 'actions.cancel', extensionName: 'academic_persons_edit')}"
                        data-ie-document-modal-close></button>
                </div>
                <div class="modal-body rounded-0">
                    <div
                        class="alert alert-danger d-none"
                        role="alert"
                        data-ie-document-error></div>
                    <div class="row g-3 pt-3" data-ie-document-fields></div>
                    <p
                        class="mb-0 d-none"
                        data-ie-document-delete-confirmation></p>
                </div>
                <div class="modal-footer rounded-0">
                    <button
                        type="button"
                        class="btn rounded-0 btn-outline-secondary"
                        data-bs-dismiss="modal"
                        data-ie-document-cancel>
                        <f:translate
                            key="actions.cancel"
                            extensionName="academic_persons_edit" />
                    </button>
                    <button
                        type="submit"
                        class="btn rounded-0 btn-primary"
                        data-ie-document-submit>
                        <span data-ie-document-submit-label>
                            <f:translate
                                key="actions.save"
                                extensionName="academic_persons_edit" />
                        </span>
                        <span
                            class="spinner-border spinner-border-sm ms-1 d-none"
                            aria-hidden="true"
                            data-ie-document-spinner></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</html>
