<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <article
        class="row g-3 align-items-start rounded-1 px-3 px-lg-4 py-4 {f:if(condition: itemIteration.isOdd, then: 'bg-body-tertiary')}"
        data-ie-document-item
        data-item-uid="{contract.uid}"
        data-item-sorting="{contract.sorting}"
        data-item-position="{itemIteration.index}">
        <f:for each="{rowFields}" as="rowField">
            <f:switch expression="{rowField}">
                <f:case value="from">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.start" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="validFrom">
                            <f:if condition="{contract.validFrom}">
                                <f:then><f:format.date format="d.m.Y">{contract.validFrom}</f:format.date></f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                    </div>
                </f:case>
                <f:case value="to">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.to" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="validTo">
                            <f:if condition="{contract.validTo}">
                                <f:then><f:format.date format="d.m.Y">{contract.validTo}</f:format.date></f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                    </div>
                </f:case>
                <f:case value="position">
                    <div class="col-12 col-sm">
                        <div class="fw-semibold">
                            <f:translate key="inlineProfile.documents.position" extensionName="academic_persons_edit" />
                        </div>
                        <div data-ie-document-value="position">
                            <f:if condition="{contract.position}">
                                <f:then>{contract.position}</f:then>
                                <f:else>—</f:else>
                            </f:if>
                        </div>
                    </div>
                </f:case>
            </f:switch>
        </f:for>
        <f:render partial="InlineProfile/Documents/Actions" arguments="{actions: actions, sortable: sortable}" />
    </article>
</html>
