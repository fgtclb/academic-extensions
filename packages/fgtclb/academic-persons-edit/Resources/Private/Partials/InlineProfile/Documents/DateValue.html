<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:if condition="{value}">
        <f:then>{value}</f:then>
        <f:else>
            <f:if condition="{fallback}">
                <f:then>{fallback}</f:then>
                <f:else>—</f:else>
            </f:if>
        </f:else>
    </f:if>
</html>
