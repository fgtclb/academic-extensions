<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <form
        class="academic-persons-inline-edit__sync-form flex-shrink-0"
        data-ie-sync-form>
        <div
            class="form-check form-switch form-check-lg mb-0 d-flex flex-row align-items-center">
            <f:if condition="{special.validation.readOnly}">
                <f:then>
                    <f:form.checkbox
                        name="skipSync"
                        id="inline-profile-{profile.uid}-skipSync"
                        class="form-check-input academic-persons-inline-edit__sync-checkbox"
                        value="1"
                        checked="{profile.skipSync}"
                        disabled="true" />
                </f:then>
                <f:else>
                    <f:form.checkbox
                        name="skipSync"
                        id="inline-profile-{profile.uid}-skipSync"
                        class="form-check-input academic-persons-inline-edit__sync-checkbox"
                        value="1"
                        checked="{profile.skipSync}"
                        disabled="{special.validation.disabled}" />
                </f:else>
            </f:if>
            <label
                class="form-check-label ms-3 cursor-pointer"
                for="inline-profile-{profile.uid}-skipSync"
                title="{f:translate(key: 'profile.skipSync.description', extensionName: 'academic_persons_edit')}">
                <f:translate
                    key="profile.skipSync.label"
                    extensionName="academic_persons_edit" />
            </label>
            <div class="invalid-feedback"></div>
        </div>
    </form>
</html>
