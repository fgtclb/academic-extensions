<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:p="http://typo3.org/ns/FGTCLB/AcademicPersons/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable name="skipSyncValidation"
        ><p:validationEnsure validations="{validations}" identifier="skipSync"
    /></f:variable>

    <form
        class="academic-persons-inline-edit__sync-form flex-shrink-0"
        data-ie-sync-form>
        <div class="form-check form-switch mb-0">
            <f:if condition="{skipSyncValidation.readOnly}">
                <f:then>
                    <f:form.checkbox
                        name="skipSync"
                        id="inline-profile-{profile.uid}-skipSync"
                        class="form-check-input academic-persons-inline-edit__sync-checkbox"
                        value="1"
                        checked="{profile.skipSync}"
                        disabled="true" />
                </f:then>
                <f:else>
                    <f:form.checkbox
                        name="skipSync"
                        id="inline-profile-{profile.uid}-skipSync"
                        class="form-check-input academic-persons-inline-edit__sync-checkbox"
                        value="1"
                        checked="{profile.skipSync}"
                        disabled="{skipSyncValidation.disabled}" />
                </f:else>
            </f:if>
            <label
                class="form-check-label"
                for="inline-profile-{profile.uid}-skipSync"
                title="{f:translate(key: 'profile.skipSync.description', extensionName: 'academic_persons_edit')}">
                <f:translate
                    key="inlineProfile.visibility.private"
                    extensionName="academic_persons_edit" />
            </label>
            <div class="invalid-feedback"></div>
        </div>
    </form>
</html>
