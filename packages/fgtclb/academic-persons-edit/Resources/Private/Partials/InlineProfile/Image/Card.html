<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <section aria-labelledby="inline-profile-{profile.uid}-image-heading">
        <f:if condition="{image}">
            <h2
                id="inline-profile-{profile.uid}-image-heading"
                class="h2 fw-normal mb-4">
                <f:translate
                    key="inlineProfile.image.heading"
                    extensionName="academic_persons_edit" />
            </h2>
            <div data-ie-image-preview>
                <f:render
                    partial="InlineProfile/Show/Image"
                    arguments="{profile: profile}" />
            </div>
            <f:if condition="{image.writable}">
                <button
                    class="btn rounded-0 btn-outline-secondary btn-sm w-100 d-inline-flex align-items-center justify-content-center mt-2"
                    type="button"
                    data-ie-open-image-modal
                    data-bs-toggle="modal"
                    data-bs-target="#inline-profile-{profile.uid}-image-modal"
                    aria-controls="inline-profile-{profile.uid}-image-modal"
                    aria-haspopup="dialog"
                    title="{f:translate(key: 'inlineProfile.image.edit', extensionName: 'academic_persons_edit')}"
                    aria-label="{f:translate(key: 'inlineProfile.image.edit', extensionName: 'academic_persons_edit')}">
                    <core:icon
                        identifier="academic-persons-inline-edit-camera"
                        size="small"
                        alternativeMarkupIdentifier="inline" />
                    <span class="ms-2"
                        >{f:translate(key: 'inlineProfile.image.edit',
                        extensionName: 'academic_persons_edit')}</span
                    >
                </button>
            </f:if>
        </f:if>
    </section>
</html>
