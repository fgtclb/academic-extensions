<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div
            data-ie-status-toast
            class="toast"
            role="status"
            aria-live="polite"
            aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto status-title"></strong>
                <button
                    type="button"
                    class="btn-close rounded-0"
                    data-bs-dismiss="toast"
                    aria-label="{f:translate(key: 'inlineProfile.image.modal.close', extensionName: 'academic_persons_edit')}"></button>
            </div>
            <div class="toast-body status-message text-white"></div>
        </div>
    </div>
</html>
