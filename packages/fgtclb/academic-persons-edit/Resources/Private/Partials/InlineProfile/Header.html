<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <header
        class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-4 mb-4">
        <h2
            id="inline-profile-{profile.uid}-personal-heading"
            class="h2 fw-normal mb-0">
            <f:translate
                key="inlineProfile.section.personal"
                extensionName="academic_persons_edit" />
        </h2>
        <div
            class="d-flex flex-wrap justify-content-between justify-content-lg-end align-items-center gap-4">
            <f:render
                partial="InlineProfile/Settings/Sync"
                arguments="{profile: profile, validations: validations}" />
            <button
                class="btn btn-outline-secondary btn-sm flex-shrink-0"
                type="button"
                data-academic-persons-inline-edit-edit-all-btn>
                <f:translate
                    key="inlineProfile.btnEditAll"
                    extensionName="academic_persons_edit" />
            </button>
        </div>
    </header>
</html>
