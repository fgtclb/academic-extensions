<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <header
        class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4 mb-5 pt-5 mt-5"
        data-ie-profile-header>
        <f:if condition="{title}">
            <h1
                id="inline-profile-{profile.uid}-name-heading"
                class="h2 fw-bolder mb-0"
                data-ie-profile-name
                data-ie-profile-name-field-ids="{title.fieldIdentifiers}">
                <f:for
                    each="{title.fields}"
                    as="field"
                    iteration="fieldIteration">
                    {profile.{field.propertyName}}<f:if
                        condition="!{fieldIteration.isLast}">
                    </f:if>
                </f:for>
            </h1>
        </f:if>
        <div
            class="d-flex flex-wrap justify-content-between justify-content-lg-end align-items-center gap-4 ms-lg-auto">
            <f:if condition="{skipSync}">
                <f:render
                    partial="InlineProfile/Settings/Sync"
                    arguments="{profile: profile, special: skipSync}" />
            </f:if>
            <button
                class="btn rounded-0 btn-outline-secondary btn-sm flex-shrink-0"
                type="button"
                data-academic-persons-inline-edit-edit-all-btn
                data-ie-edit-all-label="{f:translate(key: 'inlineProfile.btnEditAll', extensionName: 'academic_persons_edit')}"
                data-ie-close-all-label="{f:translate(key: 'inlineProfile.btnCloseAll', extensionName: 'academic_persons_edit')}"
                aria-pressed="false">
                <span data-ie-edit-all-button-label>
                    <f:translate
                        key="inlineProfile.btnEditAll"
                        extensionName="academic_persons_edit" />
                </span>
            </button>
        </div>
    </header>
</html>
