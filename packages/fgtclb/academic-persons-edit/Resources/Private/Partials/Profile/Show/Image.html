<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
    <f:if condition="{profile.image}">
        <f:then>
            <figure>
                <picture>
                    <source
                        srcset="{f:uri.image(
                            image: profile.image,
                            maxWidth: '390',
                            fileExtension: 'webp',
                        )}"
                        type="image/webp"
                        media="(min-width: 992px)"
                    />
                    <source
                        srcset="{f:uri.image(
                            image: profile.image,
                            maxWidth: '370',
                            fileExtension: 'webp',
                        )}"
                        type="image/webp"
                        media="(min-width: 768px)"
                    />
                    <source
                        srcset="{f:uri.image(
                            image: profile.image,
                            maxWidth: '690',
                            fileExtension: 'webp',
                        )}"
                        type="image/webp"
                        media="(min-width: 576px)"
                    />
                    <source
                        srcset="{f:uri.image(
                            image: profile.image,
                            maxWidth: '535',
                            fileExtension: 'webp',
                        )}"
                        type="image/webp"
                    />
                    <img
                        src="{f:uri.image(
                            image: profile.image,
                            maxWidth: 690,
                        )}"
                        alt="{profile.image.originalResource.alternative}"
                        class="w-100 h-100object-fit-contain border rounded border border-secondary"
                        title="{profile.image.originalResource.title}"
                        loading="lazy"
                    />
                </picture>
                <f:if condition="{profile.image.originalResource.description}">
                    <figcaption class="visually-hidden">
                        {profile.image.originalResource.description}
                    </figcaption>
                </f:if>
            </figure>
        </f:then>
        <f:else>
            <figure>
                <f:image
                    src="EXT:academic_persons_edit/Resources/Public/Images/profile-placeholder.png"
                    alt="{f:translate(key: 'profile.image.placeholder.alt', extensionName:
                    'academic_persons_edit')}"
                    class="w-100 h-100 object-fit-contain border rounded border border-secondary"
                    title="{f:translate(key: 'inlineProfile.user_image_not_available', extensionName:
                    'academic_persons_edit')}"
                    loading="lazy"
                />
                <figcaption class="visually-hidden">
                    {f:translate(key: 'inlineProfile.user_image_not_available',
                    extensionName: 'academic_persons_edit')}
                </figcaption>
            </figure>
        </f:else>
    </f:if>
</html>
