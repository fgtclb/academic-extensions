<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <Teleport to="#profile-editing-{profile.uid}-image-editor-target">
        <Transition
            name="academic-persons-profile-editing-image-editor"
            v-on:after-leave="finishImageClose">
            <section
                id="profile-editing-{profile.uid}-image-view"
                class="academic-persons-profile-editing__image-editor border p-3 p-lg-4 mb-5"
                v-if="image.editing"
                v-bind:aria-busy="image.pending ? 'true' : 'false'"
                v-bind:style="{ cursor: image.pending ? 'wait' : null }"
                data-pe-image-view-container>
        <div
            class="academic-persons-profile-editing__image-editor-content"
            v-on:submit.prevent="submitImage">
            <f:form
                action="uploadImage"
                controller="Profile"
                pageType="1733735"
                name="profile"
                object="{profile}"
                enctype="multipart/form-data"
                class="academic-persons-profile-editing__image-form">
                <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
                    <h2
                        class="display-6 fw-normal mb-0"
                        tabindex="-1"
                        data-pe-image-editor-heading>
                        <f:translate
                            key="profileEditing.image.editor.title"
                            extensionName="academic_persons_edit" />
                    </h2>
                    <div class="d-flex align-items-center gap-2" v-if="image.hasImage">
                        <button
                            class="btn rounded-0 btn-danger"
                            type="button"
                            data-pe-delete-image
                            v-if="!image.confirmingDelete"
                            v-on:click="requestDeleteImage"
                            v-bind:disabled="image.pending"
                            title="{f:translate(key: 'profileEditing.image.editor.deleteHint', extensionName: 'academic_persons_edit')}">
                            <f:translate
                                key="actions.delete"
                                extensionName="academic_persons_edit" />
                        </button>
                        <span
                            class="text-danger"
                            data-pe-delete-image-confirm-question
                            v-if="image.confirmingDelete">
                            <f:translate
                                key="profileEditing.image.editor.deleteConfirm"
                                extensionName="academic_persons_edit" />
                        </span>
                        <button
                            class="btn rounded-0 btn-outline-secondary"
                            type="button"
                            data-pe-cancel-delete-image
                            v-if="image.confirmingDelete"
                            v-on:click="cancelDeleteImage"
                            v-bind:disabled="image.pending">
                            <f:translate
                                key="actions.cancel"
                                extensionName="academic_persons_edit" />
                        </button>
                        <button
                            class="btn rounded-0 btn-danger"
                            type="button"
                            data-pe-confirm-delete-image
                            v-if="image.confirmingDelete"
                            v-on:click="deleteImage"
                            v-bind:disabled="image.pending"
                            title="{f:translate(key: 'profileEditing.image.editor.deleteHint', extensionName: 'academic_persons_edit')}">
                            <f:translate
                                key="actions.delete"
                                extensionName="academic_persons_edit" />
                        </button>
                    </div>
                </div>

                <fieldset v-bind:disabled="image.pending">
                    <div class="mb-3" data-pe-image-view-preview>
                        <div
                            class="academic-persons-profile-editing__image-cropper"
                            ref="cropperStage"
                            v-show="image.cropperRequested && image.hasSelection && image.previewUrl">
                            <img
                                ref="cropperSource"
                                v-bind:src="image.previewUrl"
                                v-bind:alt="image.selectedName" />
                        </div>
                        <img
                            class="img-fluid"
                            v-if="(!image.cropperRequested || !image.hasSelection) && image.previewUrl"
                            v-bind:src="image.previewUrl"
                            v-bind:alt="image.selectedName" />
                    </div>
                    <p class="text-body-secondary">
                        <f:translate
                            key="profileEditing.image.editor.hint.select"
                            extensionName="academic_persons_edit" />
                    </p>
                    <f:if condition="{image.renderType} == 'cropper'">
                        <p class="text-body-secondary">
                            <f:translate
                                key="profileEditing.image.editor.hint.ratio"
                                extensionName="academic_persons_edit" />:
                            <strong>{image.settings.ratio}</strong>
                        </p>
                    </f:if>
                    <label
                        class="form-label"
                        for="profile-editing-{profile.uid}-image">
                        <f:translate
                            key="profileEditing.image.upload.label"
                            extensionName="academic_persons_edit" />
                    </label>
                    <div v-on:change="selectImage">
                        <f:form.upload
                            property="image"
                            id="profile-editing-{profile.uid}-image"
                            class="form-control form-control-sm"
                            accept="{imageAllowedMimeTypes}"
                            aria-describedby="profile-editing-{profile.uid}-image-error"
                            v-bind:aria-invalid="image.error ? 'true' : 'false'"
                            required="true" />
                    </div>
                </fieldset>

                <div
                    id="profile-editing-{profile.uid}-image-error"
                    class="alert alert-danger mt-3 mb-0"
                    role="alert"
                    data-pe-image-error
                    v-if="image.error"
                    v-text="image.error"></div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button
                        class="btn rounded-0 btn-outline-secondary"
                        type="button"
                        data-pe-close-image-view
                        v-on:click="closeImage"
                        v-bind:disabled="image.pending">
                        <f:translate
                            key="actions.cancel"
                            extensionName="academic_persons_edit" />
                    </button>
                    <button
                        class="btn rounded-0 btn-primary"
                        type="submit"
                        data-pe-upload-image
                        v-bind:disabled="image.pending || !image.hasSelection || !image.previewUrl || (image.cropperRequested && !image.cropperReady)">
                        <span
                            class="spinner-border spinner-border-sm me-1"
                            aria-hidden="true"
                            v-if="image.pending"></span>
                        <f:translate
                            key="actions.save"
                            extensionName="academic_persons_edit" />
                    </button>
                </div>
            </f:form>
        </div>
            </section>
        </Transition>
    </Teleport>
</html>
