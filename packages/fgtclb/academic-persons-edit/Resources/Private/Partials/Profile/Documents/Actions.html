<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <div
        class="col-12 col-md-auto d-flex flex-nowrap gap-1 justify-content-end align-self-center ms-auto"
        role="group"
        aria-label="{f:translate(key: 'profileEditing.documents.actions', extensionName: 'academic_persons_edit')}"
        data-ie-document-actions>
        <f:if condition="{sortable}">
            <button
                type="button"
                class="btn rounded-0 btn-sm btn-link text-body p-2 d-none d-md-inline-flex"
                title="{f:translate(key: 'actions.dragSort', extensionName: 'academic_persons_edit')}"
                aria-label="{f:translate(key: 'actions.dragSort', extensionName: 'academic_persons_edit')}"
                draggable="true"
                data-ie-document-drag>
                <core:icon
                    identifier="academic-persons-inline-edit-grip"
                    size="small"
                    alternativeMarkupIdentifier="inline" />
            </button>
        </f:if>
        <f:for each="{actions}" as="action">
            <f:switch expression="{action}">
                <f:case value="view">
                    <button
                        type="button"
                        class="btn rounded-0 btn-sm btn-link text-body p-2"
                        title="{f:translate(key: 'actions.view', extensionName: 'academic_persons_edit')}"
                        aria-label="{f:translate(key: 'actions.view', extensionName: 'academic_persons_edit')}"
                        aria-expanded="false"
                        v-on:click.stop="openDocument('view', $event)"
                        data-ie-document-view>
                        <core:icon
                            identifier="academic-persons-inline-edit-open"
                            size="small"
                            alternativeMarkupIdentifier="inline" />
                    </button>
                </f:case>
                <f:case value="down">
                    <button
                        type="button"
                        class="btn rounded-0 btn-sm btn-link text-body p-2"
                        title="{f:translate(key: 'actions.sortDown', extensionName: 'academic_persons_edit')}"
                        aria-label="{f:translate(key: 'actions.sortDown', extensionName: 'academic_persons_edit')}"
                        v-on:click.stop="sortDocument('down', $event)"
                        data-ie-document-sort="down">
                        <core:icon
                            identifier="academic-persons-inline-edit-down"
                            size="small"
                            alternativeMarkupIdentifier="inline" />
                    </button>
                </f:case>
                <f:case value="up">
                    <button
                        type="button"
                        class="btn rounded-0 btn-sm btn-link text-body p-2"
                        title="{f:translate(key: 'actions.sortUp', extensionName: 'academic_persons_edit')}"
                        aria-label="{f:translate(key: 'actions.sortUp', extensionName: 'academic_persons_edit')}"
                        v-on:click.stop="sortDocument('up', $event)"
                        data-ie-document-sort="up">
                        <core:icon
                            identifier="academic-persons-inline-edit-up"
                            size="small"
                            alternativeMarkupIdentifier="inline" />
                    </button>
                </f:case>
                <f:case value="delete">
                    <button
                        type="button"
                        class="btn rounded-0 btn-sm btn-link text-body p-2"
                        title="{f:translate(key: 'actions.delete', extensionName: 'academic_persons_edit')}"
                        aria-label="{f:translate(key: 'actions.delete', extensionName: 'academic_persons_edit')}"
                        aria-expanded="false"
                        v-on:click.stop="openDocument('delete', $event)"
                        data-ie-document-delete>
                        <core:icon
                            identifier="academic-persons-inline-edit-delete"
                            size="small"
                            alternativeMarkupIdentifier="inline" />
                    </button>
                </f:case>
                <f:case value="edit">
                    <button
                        type="button"
                        class="btn rounded-0 btn-sm btn-link text-body p-2"
                        title="{f:translate(key: 'actions.edit', extensionName: 'academic_persons_edit')}"
                        aria-label="{f:translate(key: 'actions.edit', extensionName: 'academic_persons_edit')}"
                        aria-expanded="false"
                        v-on:click.stop="openDocument('edit', $event)"
                        data-ie-document-edit>
                        <core:icon
                            identifier="academic-persons-inline-edit-pencil"
                            size="small"
                            alternativeMarkupIdentifier="inline" />
                    </button>
                </f:case>
            </f:switch>
        </f:for>
    </div>
</html>
