<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <Teleport v-if="document.target" v-bind:to="document.target">
        <Transition
            name="academic-persons-profile-editing-document-collapse"
            v-on:after-leave="finishDocumentClose">
            <section
                class="academic-persons-profile-editing__document-collapse border bg-body p-3 p-lg-4 my-3"
                v-if="document.open"
                v-bind:aria-busy="document.pending ? 'true' : 'false'"
                v-bind:style="{ cursor: document.pending ? 'wait' : null }"
                v-bind:data-pe-document-kind="document.kind"
                data-pe-document-view-container>
                <div
                    class="academic-persons-profile-editing__document-collapse-content">
                    <form
                        v-on:submit.prevent="submitDocument"
                        data-pe-document-form>
                        <div
                            class="d-flex align-items-center justify-content-between gap-3 mb-4">
                            <h2
                                class="display-6 fw-normal mb-0"
                                tabindex="-1"
                                data-pe-document-heading
                                v-text="document.title"></h2>
                            <button
                                type="button"
                                class="btn rounded-0 btn-outline-secondary btn-sm"
                                v-if="document.mode !== 'delete'"
                                v-on:click="closeDocument"
                                v-bind:disabled="document.pending">
                                <f:translate
                                    key="actions.cancel"
                                    extensionName="academic_persons_edit" />
                            </button>
                        </div>

                        <div
                            class="alert alert-danger"
                            role="alert"
                            v-if="document.error"
                            v-text="document.error"></div>

                        <p
                            class="mb-4"
                            v-if="document.mode === 'delete'"
                            v-text="document.deleteConfirmation"></p>

                        <dl class="row mb-0" v-if="document.mode === 'view'">
                            <template
                                v-for="field in document.fields"
                                v-bind:key="field.name">
                                <dt class="col-sm-4" v-text="field.label"></dt>
                                <dd class="col-sm-8">
                                    <div
                                        v-if="field.richText && field.displayValue"
                                        v-html="documentFieldHtml(field)"></div>
                                    <span
                                        v-else-if="field.displayValue"
                                        v-text="field.displayValue"></span>
                                    <span v-else>
                                        <f:translate
                                            key="profileEditing.field.empty"
                                            extensionName="academic_persons_edit" />
                                    </span>
                                </dd>
                            </template>
                        </dl>

                        <div
                            class="mt-5"
                            v-if="document.mode === 'view' && document.kind === 'contract'">
                            <f:render partial="Profile/Documents/ContractContacts" />
                        </div>

                        <div
                            class="row g-3"
                            v-if="document.mode === 'add' || document.mode === 'edit'"
                            data-pe-document-fields>
                            <div
                                v-for="(field, index) in document.fields"
                                v-bind:key="field.name"
                                v-bind:class="[field.columnClass || (field.type === 'textarea' || field.type === 'checkbox' ? 'col-12' : 'col-12 col-md-6'), { 'd-flex align-items-end': field.compactCheckbox }]">
                                <div
                                    v-bind:class="field.type === 'checkbox' ? 'form-check' : ''">
                                    <div
                                        class="d-flex align-items-center"
                                        v-if="field.type !== 'checkbox'">
                                        <label
                                            class="form-label"
                                            v-bind:for="'profile-editing-document-field-' + index + '-' + field.name">
                                            <span v-text="field.label"></span>
                                            <span
                                                class="text-danger ms-1"
                                                aria-hidden="true"
                                                v-if="field.required"
                                                >*</span
                                            >
                                        </label>
                                        <button
                                            type="button"
                                            class="btn rounded-0 btn-link link-info p-0 ms-2 mb-1"
                                            v-if="field.helptext"
                                            data-bs-toggle="popover"
                                            data-pe-helptext
                                            data-bs-trigger="focus"
                                            data-bs-placement="right"
                                            data-bs-custom-class="custom-popover"
                                            v-bind:data-bs-title="field.label"
                                            v-bind:data-bs-content="field.helptext"
                                            v-bind:aria-label="field.label + ': ' + field.helptext">
                                            <core:icon
                                                identifier="academic-persons-edit-help"
                                                size="small"
                                                alternativeMarkupIdentifier="inline" />
                                        </button>
                                    </div>

                                    <select
                                        class="form-select"
                                        v-if="field.type === 'select'"
                                        v-bind:id="'profile-editing-document-field-' + index + '-' + field.name"
                                        v-bind:name="field.name"
                                        v-bind:required="field.required"
                                        v-bind:disabled="field.disabled || document.pending"
                                        v-bind:autocomplete="field.autocomplete || null"
                                        v-bind:aria-describedby="'profile-editing-document-field-error-' + index + '-' + field.name"
                                        v-bind:aria-invalid="document.errors[field.name] ? 'true' : 'false'"
                                        v-model="document.values[field.name]"
                                        v-bind:data-pe-document-field="field.name">
                                        <option value="">—</option>
                                        <option
                                            v-for="option in field.options"
                                            v-bind:key="option.value"
                                            v-bind:value="option.value"
                                            v-text="option.label"></option>
                                    </select>

                                    <textarea
                                        class="form-control"
                                        rows="6"
                                        v-else-if="field.type === 'textarea'"
                                        v-bind:id="'profile-editing-document-field-' + index + '-' + field.name"
                                        v-bind:name="field.name"
                                        v-bind:required="field.required"
                                        v-bind:readonly="field.readOnly"
                                        v-bind:disabled="field.disabled || document.pending"
                                        v-bind:autocomplete="field.autocomplete || null"
                                        v-bind:aria-describedby="'profile-editing-document-field-error-' + index + '-' + field.name"
                                        v-bind:aria-invalid="document.errors[field.name] ? 'true' : 'false'"
                                        v-bind:data-pe-rich-text="field.richText ? '' : null"
                                        v-bind:data-pe-character-limit="field.characterLimit || null"
                                        v-bind:data-pe-document-field="field.name"
                                        v-model="document.values[field.name]"></textarea>

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        v-else-if="field.type === 'checkbox'"
                                        v-bind:id="'profile-editing-document-field-' + index + '-' + field.name"
                                        v-bind:name="field.name"
                                        v-bind:disabled="field.disabled || document.pending"
                                        v-bind:aria-describedby="'profile-editing-document-field-error-' + index + '-' + field.name"
                                        v-bind:aria-invalid="document.errors[field.name] ? 'true' : 'false'"
                                        v-bind:data-pe-document-field="field.name"
                                        v-model="document.values[field.name]" />

                                    <input
                                        class="form-control"
                                        v-else
                                        v-bind:type="field.type || 'text'"
                                        v-bind:id="'profile-editing-document-field-' + index + '-' + field.name"
                                        v-bind:name="field.name"
                                        v-bind:required="field.required"
                                        v-bind:readonly="field.readOnly"
                                        v-bind:disabled="field.disabled || document.pending"
                                        v-bind:autocomplete="field.autocomplete || null"
                                        v-bind:aria-describedby="'profile-editing-document-field-error-' + index + '-' + field.name"
                                        v-bind:aria-invalid="document.errors[field.name] ? 'true' : 'false'"
                                        v-bind:data-pe-document-field="field.name"
                                        v-model="document.values[field.name]" />

                                    <label
                                        class="form-check-label ms-2"
                                        v-if="field.type === 'checkbox'"
                                        v-bind:for="'profile-editing-document-field-' + index + '-' + field.name"
                                        v-text="field.label"></label>
                                    <button
                                        type="button"
                                        class="btn rounded-0 btn-link link-info p-0 ms-2 mb-1"
                                        v-if="field.type === 'checkbox' && field.helptext"
                                        data-bs-toggle="popover"
                                        data-pe-helptext
                                        data-bs-trigger="focus"
                                        data-bs-placement="right"
                                        data-bs-custom-class="custom-popover"
                                        v-bind:data-bs-title="field.label"
                                        v-bind:data-bs-content="field.helptext"
                                        v-bind:aria-label="field.label + ': ' + field.helptext">
                                        <core:icon
                                            identifier="academic-persons-edit-help"
                                            size="small"
                                            alternativeMarkupIdentifier="inline" />
                                    </button>
                                    <div
                                        class="form-text text-end"
                                        aria-live="polite"
                                        v-if="field.richText && field.characterLimit"
                                        data-pe-character-counter
                                        v-bind:data-pe-for="'profile-editing-document-field-' + index + '-' + field.name">
                                        0 /
                                        <span
                                            v-text="field.characterLimit"></span>
                                    </div>
                                    <div
                                        v-bind:id="'profile-editing-document-field-error-' + index + '-' + field.name"
                                        class="invalid-feedback d-block"
                                        role="alert"
                                        v-if="document.errors[field.name]"
                                        v-text="document.errors[field.name]"></div>
                                </div>
                            </div>
                        </div>

                        <div
                            class="d-flex justify-content-end gap-2 mt-4"
                            v-if="document.mode !== 'view'">
                            <button
                                type="button"
                                class="btn rounded-0 btn-outline-secondary"
                                v-on:click="closeDocument"
                                v-bind:disabled="document.pending">
                                <f:translate
                                    key="actions.cancel"
                                    extensionName="academic_persons_edit" />
                            </button>
                            <button
                                type="submit"
                                class="btn rounded-0"
                                v-bind:class="document.mode === 'delete' ? 'btn-danger' : 'btn-primary'"
                                v-bind:disabled="document.pending">
                                <span
                                    class="spinner-border spinner-border-sm me-1"
                                    aria-hidden="true"
                                    v-if="document.pending"></span>
                                <span v-if="document.mode === 'delete'">
                                    <f:translate
                                        key="actions.delete"
                                        extensionName="academic_persons_edit" />
                                </span>
                                <span v-else>
                                    <f:translate
                                        key="actions.save"
                                        extensionName="academic_persons_edit" />
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </Transition>
    </Teleport>
</html>
