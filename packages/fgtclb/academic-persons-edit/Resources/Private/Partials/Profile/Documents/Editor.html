<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <!--
        The mount point of the document editor.

        There is no markup left to render here. The editor shows the fields,
        the labels, the options and the display values of one record, and all
        of them come from the "documentForm" response - so it is rendered in
        the browser, by "<academic-persons-edit-document-editor>"
        ("Resources/Private/TypeScript/frontend/profile/elements/document-editor.ts"),
        which "profile/documents.ts" creates inside the collapse target of the
        row or of the section that was opened. Vue rendered the editor here and
        moved it into that target with a teleport; the element is created
        where it belongs and is never moved, because moving it would disconnect
        and destroy the CKEditor instances below it.

        The icons the editor needs are rendered as
        "<template data-pe-icon='...'>" by "Templates/Profile/Index.html" and
        cloned from there, so the icon registry stays the single source.

        Consequence for integrators: this partial no longer carries the markup
        of the editor and overriding it changes nothing about what is shown.
    -->
</html>
