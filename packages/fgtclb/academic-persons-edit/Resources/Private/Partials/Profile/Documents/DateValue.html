<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
    <f:variable
        name="datePattern"
        value="{f:if(condition: yearOnly, then: 'y', else: 'MEDIUMDATE')}" />
    <f:if condition="{value}">
        <f:then><f:format.date date="{value}" pattern="{datePattern}" /></f:then>
        <f:else>
            <f:if condition="{fallback}">
                <f:then><f:format.date date="{fallback}" pattern="{datePattern}" /></f:then>
                <f:else>—</f:else>
            </f:if>
        </f:else>
    </f:if>
</html>
