<html
    lang="en"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>

<table class="ace-table">
    <thead class="ace-head">
        <tr class="ace-item">
            <f:for
                each="{
                    0: 'title',
                    1: 'endsOn',
                }"
                as="column"
            >
                <th class="ace-label">
                    {f:translate(key: 'jobs.bite.{column}', extensionName: 'AcademicBiteJobs')}
                </th>
            </f:for>
        </tr>
    </thead>
    <tbody class="ace-body">
        <f:for each="{jobs}" as="job">
            <tr class="ace-item">
                <td class="ace-value">
                    <a class="ace-link" href="{job.url}" target="_blank">{job.title}</a>
                </td>

                <td class="ace-value">
                    {job.endsOn -> f:format.date(format: 'd.m.Y')}
                </td>

                <!-- Add custom fields here -->
            </tr>
        </f:for>
    </tbody>
</table>

</html>
