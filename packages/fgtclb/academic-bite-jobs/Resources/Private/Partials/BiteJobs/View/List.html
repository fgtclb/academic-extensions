<html
    lang="en"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>

<div class="ace-itemlist ace-list-view">
    <f:for each="{jobs}" as="job">
        <article class="ace-item">
            <div class="ace-item-content">
                <f:render
                    partial="BiteJobs/Header"
                    arguments="{
                        header: job.title,
                        layout: data.header_layout,
                        subheader: data.subheader,
                        link: job.url,
                        grouped: grouped
                    }"
                />

                <ul class="ace-list">
                    <li class="ace-list-item">
                        <b class="ace-label">{f:translate(key: 'jobs.bite.endsOn', extensionName: 'AcademicBiteJobs')}:</b>

                        <span class="ace-value">{job.endsOn -> f:format.date(format: 'd.m.Y')}</span>
                    </li>

                    <!-- Add custom fields here -->
                </ul>
            </div>
        </article>
    </f:for>
</div>

</html>
