<html
    lang="en"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>

<div>
    <f:for each="{jobs}" as="job">
        <div>
            <f:render
                partial="BiteJobs/Header"
                arguments="{
                    header: job.title,
                    layout: data.header_layout,
                    subheader: data.subheader,
                    link: job.url,
                    grouped: grouped
                }"
            />

            <ul>
                <li>
                    <b>{f:translate(key: 'jobs.bite.endsOn', extensionName: 'AcademicBiteJobs')}:</b>

                    <span>{job.endsOn -> f:format.date(format: 'd.m.Y')}</span>
                </li>

                <!-- Add custom fields here -->
            </ul>
        </div>
    </f:for>
</div>

</html>
