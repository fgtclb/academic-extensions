services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicProjects\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*.php'

  FGTCLB\AcademicProjects\Domain\Repository\ProjectRepository:
    public: true

  FGTCLB\AcademicProjects\DataProcessing\ProjectProcessor:
    tags:
      - {
          name: 'data.processor',
          identifier: 'project-data',
          label: 'Project Processor'
        }

  # TYPO3's `Core\Attribute\AsEventListener` does not exist on TYPO3 v12, which this
  # branch supports, so the listener is registered here. Symfony's attribute of the same
  # name is not a substitute: it registers nothing in TYPO3 and the listener would
  # silently never fire.
  FGTCLB\AcademicProjects\EventListener\AddPageModuleCategorySummary:
    tags:
      - name: event.listener
        identifier: 'academic-projects/page-module-category-summary'
        event: TYPO3\CMS\Backend\Controller\Event\ModifyPageLayoutContentEvent
