# Site settings of the project page type, and of the category filters and the
# content element header of the project lists.
#
# Every path below is also assigned in
# "Configuration/TypoScript/constants.typoscript", and the default has to be the
# same in both files: a site that uses the site set and the static template
# reads the constants after the site settings, so a differing default resets
# what the integrator configured, silently.
#
# Declared with the aggregate set rather than with a component set: both content
# elements, "Projects" and "Projects (selected)", render the filter and the
# header, every component delivers the page type, and a set can only declare
# settings next to its own "config.yaml". A site that depends on a component set
# alone still gets the defaults of the constants, but the site settings editor
# does not offer the settings - depend on this set for that.
categories:
  academic:
    label: 'Academic'
  academic.projects:
    label: 'Projects'
    parent: academic

settings:
  plugin.tx_academicprojects.page.layout:
    label: 'Project page | Page layout'
    description: 'The Fluid layout of the site package the project page renders its section "Main" into. The layout has to exist. Only for "Default" does the extension bring a fallback, which renders the page without the frame of the site.'
    category: academic.projects
    type: string
    default: 'Default'
  plugin.tx_academicprojects.filter.categoryTypes:
    label: 'Project lists | Filter types'
    description: 'The category filters the project lists offer, in this order, comma-separated: category type identifiers of the group "projects" (competence_field, cooperation, funding_partner, project_department, ...). A type without categories is left out. Empty: every category type with categories, in the type order of the group.'
    category: academic.projects
    type: string
    default: ''
  plugin.tx_academicprojects.filter.visibleCount:
    label: 'Project lists | Visible filters'
    description: 'How many category filters are shown right away. The others are shown behind "More filters", which the visitor opens, and which is open while one of its filters is in use. 0 shows every filter.'
    category: academic.projects
    type: int
    default: 0
  plugin.tx_academicprojects.filter.hideDisabledOptions:
    label: 'Project lists | Hide options without results'
    description: 'Leaves out the categories no listed project carries, instead of showing them as disabled options. A selected category is always shown.'
    category: academic.projects
    type: bool
    default: false
  plugin.tx_academicprojects.filter.showActiveFilters:
    label: 'Project lists | Active filter tags'
    description: 'Shows one tag per selected filter above a project list. Each tag links to the list without that filter and keeps every other selection and the sorting.'
    category: academic.projects
    type: bool
    default: false
  plugin.tx_academicprojects.filter.showReset:
    label: 'Project lists | Reset link'
    description: 'Shows a link that resets every filter, back to the list as the content element presets it. Shown while the visitor has filtered.'
    category: academic.projects
    type: bool
    default: false
  plugin.tx_academicprojects.filter.showResultCount:
    label: 'Project lists | Result count'
    description: 'Shows the number of projects found.'
    category: academic.projects
    type: bool
    default: false
  plugin.tx_academicprojects.renderContentElementHeader:
    label: 'Project lists | Render the content element header'
    description: 'Only for a site whose content element layout renders no header. The layouts of EXT:fluid_styled_content and of the bootstrap package render it, and switched on there the header appears twice.'
    category: academic.projects
    type: bool
    default: false
