<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="!{settings.hideSorting} || !{settings.hideFilter} || !{settings.hideActiveState}">
    <f:form action="list" name="demand" object="{demand}" class="academic-projects-filtersorting">
        <div class="row">
            <f:if condition="!{settings.hideSorting}">
                <f:render
                    partial="Project/DemandSorting"
                    arguments="{_all}"
                />
            </f:if>

            <f:if condition="!{settings.hideFilter}">
                <f:render
                    partial="Project/DemandCategories"
                    arguments="{_all}"
                />
            </f:if>

            <f:if condition="!{settings.hideActiveState}">
                <f:render
                    partial="Project/DemandActiveState"
                    arguments="{_all}"
                />
            </f:if>
        </div>
    </f:form>
</f:if>

<f:comment>
    The active filters, the reset link and the result count are switched on per site by
    `settings.filter.showActiveFilters`, `showReset` and `showResultCount`. The first two
    belong to the filter and the state select, so a list that hides both shows neither.
</f:comment>
<f:if condition="!{settings.hideFilter} || !{settings.hideActiveState}">
    <f:if condition="{settings.filter.showActiveFilters} || {settings.filter.showReset}">
        <f:render
            partial="Project/ActiveFilters"
            arguments="{_all}"
        />
    </f:if>
</f:if>

<f:if condition="{settings.filter.showResultCount}">
    <f:render
        partial="Project/ResultCount"
        arguments="{count: '{projects -> f:count()}'}"
    />
</f:if>

</html>
