<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Default" />

<f:section name="Main">

    <f:if condition="{settings.assets.css}">
        <f:asset.css identifier="academicStudyPlan" href="EXT:academic_study_plan/Resources/Public/Css/frontend/academic-study-plan.css" />
    </f:if>
    <f:if condition="{settings.assets.js}">
        <f:asset.module identifier="@fgtclb/academic-study-plan/frontend/academic-study-plan.js" />
    </f:if>

    <f:comment>
        Every part the script needs carries a `data-study-plan-*` attribute, and the
        parts are partials so that an installation can replace one of them without
        touching the others. Both are documented in the manual, chapter "Templates".
    </f:comment>

    <div
        class="academic-study-plan container"
        data-study-plan="{data.uid}"
        data-filter-label="{f:translate(key: 'filter.label', extensionName: 'academic_study_plan')}"
    >
        <f:render partial="StudyPlan/Filter" arguments="{collapsible: settings.filter.collapsible}" />

        <f:if condition="{semesters}">
            <ul class="semesters row">
                <f:for each="{semesters}" as="semester">
                    <f:render partial="StudyPlan/Semester" arguments="{semester: semester}" />
                </f:for>
            </ul>
        </f:if>

        <f:if condition="{data.tx_academicstudyplan_footer_note}">
            <f:format.html>{data.tx_academicstudyplan_footer_note}</f:format.html>
        </f:if>
    </div>

</f:section>

</html>
