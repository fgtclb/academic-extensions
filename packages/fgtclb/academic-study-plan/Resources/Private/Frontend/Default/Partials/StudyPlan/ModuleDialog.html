<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ab="http://typo3.org/ns/FGTCLB/AcademicBase/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The dialog of one module.

    Arguments:

    - module: the module record.

    The first `<button>` of the dialog is its close control - the script wires that
    one and stops whatever the dialog was playing when it closes. The dialog is
    rendered inside the module it belongs to, which is how the script pairs the two
    when a trigger carries no `data-dialog-id`.
</f:comment>

<dialog id="popup-{module.uid}" class="ace-dialog" data-study-plan-dialog>
    <div class="ace-header">
        <div class="ace-content">
            <span class="ace-title" aria-hidden="true"><b>{module.label}</b></span>

            <f:if condition="{module.credit_points}">
                <span class="ace-credits" aria-hidden="true">
                    {module.credit_points} {f:translate(key: 'credits', extensionName: 'AcademicStudyPlan')}
                </span>
            </f:if>
        </div>

        <button class="ace-close" aria-label="{f:translate(key: 'modal.close', extensionName: 'AcademicStudyPlan')}">
            <ab:icon identifier="tx-academicbase-action-close" alternativeMarkupIdentifier="inline" />
        </button>
    </div>

    <f:if condition="{module.note}">
        <span class="ace-note" aria-hidden="true">{module.note}</span>
    </f:if>

    <f:if condition="{module.description}">
        <p class="ace-description"><f:format.nl2br>{module.description}</f:format.nl2br></p>
    </f:if>

    <f:if condition="{module.audioFiles}">
        <f:for each="{module.audioFiles}" as="audioFile">
            <audio class="ace-audio" controls aria-label="{f:translate(key: 'modal.audio', extensionName: 'AcademicStudyPlan')}: {module.label}">
                <source src="{audioFile.publicUrl}" type="{audioFile.mimeType}">
            </audio>
        </f:for>
    </f:if>
</dialog>

</html>
