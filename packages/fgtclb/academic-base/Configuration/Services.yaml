services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicBase\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Implements an interface of EXT:reports, so the class cannot be loaded
      # without that extension. Services.php registers it when it is there.
      - '../Classes/Report/*'

  # @internal not part of public API
  academic-base.serializer:
    class: Symfony\Component\Serializer\SerializerInterface
    factory: '@FGTCLB\AcademicBase\Factory\SerializerFactory'

