<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A file upload. The arguments are those of "Academic/Form/Textfield".
</f:comment>

<f:variable name="elementId" value="{objectName}.{element.identifier}"/>

<f:render
    partial="{fieldWrapperPartial -> f:or(alternative: 'Academic/Form/FieldWrapper')}"
    arguments="{element: element, elementId: elementId, class: 'form-upload-wrap', extensionName: extensionName}"
    contentAs="elementContent"
>
    <f:form.upload property="{element.identifier}" class="form-control" id="{elementId}"/>
</f:render>

</html>
