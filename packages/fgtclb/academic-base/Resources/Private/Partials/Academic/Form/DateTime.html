<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A date field. The element's "value" is shown in the format "d.m.Y". The arguments
    are those of "Academic/Form/Textfield".
</f:comment>

<f:variable name="elementId" value="{objectName}.{element.identifier}"/>

<f:render
    partial="{fieldWrapperPartial -> f:or(alternative: 'Academic/Form/FieldWrapper')}"
    arguments="{element: element, elementId: elementId, class: 'form-date-wrap', extensionName: extensionName}"
    contentAs="elementContent"
>
    <f:form.textfield
        property="{element.identifier}"
        value="{element.value -> f:format.date(format:'d.m.Y')}"
        id="{elementId}"
        class="form-control"
        disabled="{element.disabled}"
        data="{render:'datepicker'}"
        type="date"
    />
</f:render>

</html>
