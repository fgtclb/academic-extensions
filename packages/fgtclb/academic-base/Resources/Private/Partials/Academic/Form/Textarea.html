<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A text area, with the class "rich-text" when the element sets "richtext". The
    arguments are those of "Academic/Form/Textfield".
</f:comment>

<f:variable name="elementId" value="{objectName}.{element.identifier}"/>
<f:form.validationResults for="{elementId}" as="fieldValidationResults">
    <f:if condition="{fieldValidationResults.flattenedErrors}">
        <f:variable name="fieldAria" value="{invalid: 'true', describedby: '{elementId}-error'}"/>
    </f:if>
</f:form.validationResults>

<f:render
    partial="{fieldWrapperPartial -> f:or(alternative: 'Academic/Form/FieldWrapper')}"
    arguments="{element: element, elementId: elementId, class: 'form-textarea-wrap', extensionName: extensionName}"
    contentAs="elementContent"
>
    <f:form.textarea
        property="{element.identifier}"
        id="{elementId}"
        class="form-control {f:if(condition: element.richtext, then: 'rich-text')}"
        errorClass="is-invalid"
        aria="{fieldAria}"
        disabled="{element.disabled}"
        placeholder="{f:translate(key:'edit.{elementId}.placeholder', extensionName: extensionName)}"
        rows="5"
    />
</f:render>

</html>
