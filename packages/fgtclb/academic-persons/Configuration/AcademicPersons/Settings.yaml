# Public profile
# --------------
# The detail template builds the public profile from this configuration.
# - `structure` lists the supported element identifiers for every layout
#   column. The shipped template renders `left` as the desktop navigation and
#   `right` as the main content. On mobile, `left` is inserted again directly
#   before `subline`, so keep `subline` in `right` when mobile navigation is
#   required.
# - Supported elements are `menuSections`, `headline`, `position`,
#   `profileImage`, `contact`, `subline`, `profileEntries` and
#   `menuSectionsDatas`. Unknown identifiers render nothing.
# - `details` supplies each element's ordered Profile properties, relation
#   mapping, LLL label or special renderer. Empty referenced data is skipped.
# - `headline`, `profileImage` and `profileEntries` contain direct Profile
#   property names. `subline` contains an LLL translation key.
# - `position.special` and `contact.special` currently support
#   `datasFromContracts`, which renders the corresponding Contract data.
# - `menuSections` contains stable navigation identifiers;
#   `menuSectionsDatas` maps each identifier to its Profile relation property.
profile:
  structure:
    left:
      - menuSections
    right:
      - headline
      - position
      - profileImage
      - contact
      - subline
      - profileEntries
      - menuSectionsDatas
  details:
    menuSections:
      - researchProjects
      - academicCareer
      - membershipsCommitteeActivities
      - networkCooperation
      - publications
      - lectures
    headline:
      - title
      - firstName
      - middleName
      - lastName
    position:
      special: datasFromContracts
    profileImage:
      - image
    contact:
      special: datasFromContracts
    subline: "LLL:EXT:academic_persons/Resources/Private/Language/locallang.xlf:detail.subline"
    profileEntries:
      - teachingArea
      - coreCompetences
      - supervisedThesis
      - supervisedDoctoralThesis
      - miscellaneous
    menuSectionsDatas:
      researchProjects: scientificResearch
      academicCareer: vita
      membershipsCommitteeActivities: memberships
      networkCooperation: cooperation
      publications: publications
      lectures: lectures
