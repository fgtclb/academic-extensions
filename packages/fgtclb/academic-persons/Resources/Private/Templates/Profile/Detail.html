<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:asset.module identifier="@fgtclb/academic-persons/frontend/profile.js" />
    <f:asset.css
        identifier="academic-persons-detail-additional-css"
        href="EXT:academic_persons/Resources/Public/Css/additional.css" />

    <div
        class="container-fluid academic-persons-detail px-0"
        data-academic-persons-detail>
        <div
            class="row gx-lg-5 gy-5 align-items-stretch academic-persons-detail__layout">
            <aside
                class="col-12 col-lg-4 d-none d-lg-block academic-persons-detail__aside">
                <div
                    class="sticky-top academic-persons-detail__sticky-navigation"
                    data-academic-persons-sticky-navigation>
                    <f:for each="{publicProfile.structure.left}" as="element">
                        <f:render
                            partial="Profile/PublicProfile/Element"
                            arguments="{_all}" />
                    </f:for>
                </div>
            </aside>
            <main class="col-12 col-lg-6 academic-persons-detail__main">
                <f:for each="{publicProfile.structure.right}" as="element">
                    <f:if condition="{element} == 'subline'">
                        <aside
                            class="d-lg-none academic-persons-detail__mobile-navigation">
                            <f:for
                                each="{publicProfile.structure.left}"
                                as="mobileElement">
                                <f:render
                                    partial="Profile/PublicProfile/Element"
                                    arguments="{
                                    profile: profile,
                                    data: data,
                                    publicProfile: publicProfile,
                                    element: mobileElement
                                }" />
                            </f:for>
                        </aside>
                    </f:if>
                    <f:render
                        partial="Profile/PublicProfile/Element"
                        arguments="{_all}" />
                </f:for>
            </main>
        </div>
    </div>
</html>
