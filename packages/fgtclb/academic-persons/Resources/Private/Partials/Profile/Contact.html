<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:if condition="({profile.publishEmailAddress} && {profile.emailAddress}) || ({profile.publishPhoneNumber} && {profile.phoneNumber})">
        <section class="academic-persons-detail__profile-contact">
            <f:render
                partial="Profile/SectionHeader"
                arguments="{
                    header: '{f:translate(key: \'detail.profileContact\', extensionName: \'academic_persons\')}',
                    layout: '{data.header_layout}',
                    subheader: '{data.subheader}',
                    detail: 'true'
                }" />
            <address>
                <f:if condition="{profile.publishEmailAddress} && {profile.emailAddress}">
                    <div>
                        <b>{f:translate(key: 'detail.emailAddress', extensionName: 'academic_persons')}:</b>
                        <f:link.email email="{profile.emailAddress}">{profile.emailAddress}</f:link.email>
                    </div>
                </f:if>
                <f:if condition="{profile.publishPhoneNumber} && {profile.phoneNumber}">
                    <div>
                        <b>{f:translate(key: 'detail.phoneNumber', extensionName: 'academic_persons')}:</b>
                        <a href="tel:{profile.phoneNumber}">{profile.phoneNumber}</a>
                    </div>
                </f:if>
            </address>
        </section>
    </f:if>
</html>
