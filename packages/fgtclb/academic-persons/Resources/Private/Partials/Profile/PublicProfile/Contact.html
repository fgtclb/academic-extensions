<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<f:switch expression="{publicProfile.details.contact.special}">
    <f:case value="datasFromContracts">
        <f:if condition="{profile.contracts}">
            <section class="academic-persons-detail__contact">
                <h2 class="academic-persons-detail__contact-heading">
                    <f:translate key="detail.contact" extensionName="academic_persons" />
                </h2>
                <f:for each="{profile.contracts}" as="contract">
                    <div class="academic-persons-detail__contact-contract">
                        <f:if condition="{contract.emailAddresses}">
                            <div class="academic-persons-detail__contact-row">
                                <img
                                    class="academic-persons-detail__contact-icon rounded-0"
                                    src="{f:uri.resource(path: 'Icons/envelope.svg', extensionName: 'AcademicPersons')}"
                                    alt=""
                                    aria-hidden="true"
                                />
                                <div class="academic-persons-detail__contact-content">
                                    <f:for each="{contract.emailAddresses}" as="emailAddress">
                                        <f:link.email
                                            email="{emailAddress.email}"
                                            class="academic-persons-detail__contact-link"
                                        >{emailAddress.email}</f:link.email>
                                    </f:for>
                                </div>
                            </div>
                        </f:if>
                        <f:if condition="{contract.phoneNumbers}">
                            <div class="academic-persons-detail__contact-row">
                                <img
                                    class="academic-persons-detail__contact-icon rounded-0"
                                    src="{f:uri.resource(path: 'Icons/phone.svg', extensionName: 'AcademicPersons')}"
                                    alt=""
                                    aria-hidden="true"
                                />
                                <div class="academic-persons-detail__contact-content">
                                    <f:for each="{contract.phoneNumbers}" as="phoneNumber">
                                        <a
                                            class="academic-persons-detail__contact-link"
                                            href="tel:{phoneNumber.phoneNumber}"
                                        >{phoneNumber.phoneNumber}</a>
                                    </f:for>
                                </div>
                            </div>
                        </f:if>
                        <f:for each="{contract.physicalAddresses}" as="physicalAddress">
                            <div class="academic-persons-detail__contact-row">
                                <img
                                    class="academic-persons-detail__contact-icon rounded-0"
                                    src="{f:uri.resource(path: 'Icons/address.svg', extensionName: 'AcademicPersons')}"
                                    alt=""
                                    aria-hidden="true"
                                />
                                <address class="academic-persons-detail__contact-content">
                                    <f:if condition="{physicalAddress.street} || {physicalAddress.streetNumber}">
                                        <span class="academic-persons-detail__contact-line">
                                            {physicalAddress.street} {physicalAddress.streetNumber}
                                        </span>
                                    </f:if>
                                    <f:if condition="{physicalAddress.additional}">
                                        <span class="academic-persons-detail__contact-line">
                                            {physicalAddress.additional}
                                        </span>
                                    </f:if>
                                    <f:if condition="{physicalAddress.zip} || {physicalAddress.city}">
                                        <span class="academic-persons-detail__contact-line">
                                            {physicalAddress.zip} {physicalAddress.city}
                                        </span>
                                    </f:if>
                                    <f:if condition="{physicalAddress.state}">
                                        <span class="academic-persons-detail__contact-line">
                                            {physicalAddress.state}
                                        </span>
                                    </f:if>
                                    <f:if condition="{physicalAddress.country}">
                                        <span class="academic-persons-detail__contact-line">
                                            {physicalAddress.country}
                                        </span>
                                    </f:if>
                                </address>
                            </div>
                        </f:for>
                        <f:if condition="{contract.location} || {contract.room}">
                            <div class="academic-persons-detail__contact-row">
                                <img
                                    class="academic-persons-detail__contact-icon rounded-0"
                                    src="{f:uri.resource(path: 'Icons/room.svg', extensionName: 'AcademicPersons')}"
                                    alt=""
                                    aria-hidden="true"
                                />
                                <div class="academic-persons-detail__contact-content">
                                    <f:if condition="{contract.location}">
                                        <strong class="academic-persons-detail__contact-line">
                                            {contract.location.title}
                                        </strong>
                                    </f:if>
                                    <f:if condition="{contract.room}">
                                        <span class="academic-persons-detail__contact-line">
                                            <f:translate
                                                key="detail.room"
                                                extensionName="academic_persons"
                                            />: {contract.room}
                                        </span>
                                    </f:if>
                                </div>
                            </div>
                        </f:if>
                    </div>
                </f:for>
            </section>
        </f:if>
    </f:case>
</f:switch>

</html>
