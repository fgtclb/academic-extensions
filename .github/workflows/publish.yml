name: publish

# Turns a version tag into a GitHub release with one TER upload artifact per
# extension attached.
#
# This workflow deliberately does **not** publish to the TER. The repository
# root is a composer "project", not an extension, so there is nothing here to
# publish. TER publishing happens one step later and per extension: the external
# splitter mirrors the tagged state into the read-only split repositories, where
# each package's own workflow runs "tailor ter:publish". That workflow is
# maintained here as "packages/fgtclb/<package>/.github/workflows/publish.yml"
# and is split out with the package, so it is changed in this repository and
# never downstream.
#
# Triggered by pushing a tag. The tag has to be a bare "MAJOR.MINOR.PATCH"
# without a "v" prefix — which is what "bin/release" creates — and it has to
# match the "version" in every "ext_emconf.php". "tailor create-artefact" fails
# otherwise, on purpose, so a release cannot disagree with the extension
# metadata.
#
# The extension keys are read from each "composer.json" at runtime
# ("extra.typo3/cms.extension-key"), because the directory name is not always
# the extension key — "academic-contact4pages" ships "academic_contacts4pages".
#
# Kept as a dedicated workflow rather than folded into "ci.yml": it has a
# different trigger, needs "contents: write", and must stay reviewable on its
# own.

on:
  push:
    tags:
      - '*'

# Composer fetches every dist archive from "api.github.com" and
# "codeload.github.com". Unauthenticated that is 60 requests per hour and per
# runner IP, which took out the pull request pipeline in bursts (ACE-452).
#
# The same limit applies to "composer global require" below, which installs
# tailor on the runner host rather than in a container - so "runTests.sh"
# forwards nothing to it and this workflow needs its own token.
#
# "setup-php" does write a "github-oauth" entry into composer's "auth.json"
# from the token its "github-token" input already defaults to, which is why
# this has not been observed failing. It is not something to rely on: the
# action deliberately writes nothing for the composer versions affected by
# GHSA-f9f8-rm49-7jv2, and "tools: composer:v2" is a floating tag that has
# pointed into that range before. "COMPOSER_AUTH" is independent of both and
# reaches composer directly.
#
# "github.token" rather than "secrets.GITHUB_TOKEN": the two are the same
# installation token, and the "github" context is available to a workflow level
# "env" block.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  publish:
    name: Ensure GitHub Release with extension TER artifact and publishing to TER
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify tag
        run: |
          if ! [[ ${{ github.ref }} =~ ^refs/tags/[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}$ ]]; then
            echo "ERR: Invalid publish version tag: ${{ github.ref }}"
            exit 1
          fi

      - name: Get version
        id: get-version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.0
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress --no-suggest

      # Note that step will fail when `env.version` does not match the `ext_emconf.php` version.
      - name: Create local TER package upload artifact
        shell: bash
        run: |
          find packages/fgtclb \
            -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | while read -d $'\n' extension
          do
            extensionKey="$(cat "packages/fgtclb/${extension}/composer.json" | jq -r '.extra."typo3/cms"."extension-key"' )"
            if [[ "${extensionKey}" != "" ]]; then
              php ~/.composer/vendor/bin/tailor create-artefact ${{ env.version }} ${extensionKey} --path="packages/fgtclb/${extension}"
            fi
          done

#      - name: Render documentation of all academic extensions
#        shell: bash
#        # We enforce successfull state here
#        run: |
#          Build/Scripts/runTests.sh -b docker -s checkRstRenderingAll | true
#          cd documentation-rendered
#          find . -type d -maxdepth 1 -exec zip -r {}_documentation-${{ env.version }}.zip {} \

      # Note that when release already exists for tag, only files will be uploaded and lets this acting as a
      # fallback to ensure that a real GitHub release is created for the tag along with extension artifacts.
      #             documentation-rendered/*_documentation-${{ env.version }}.zip
      - name: Create release and upload artifacts in the same step
        uses: softprops/action-gh-release@v2
        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          name: "[RELEASE] ${{ env.version }}"
          generate_release_notes: true
          files: |
            tailor-version-artefact/*_${{ env.version }}.zip
            LICENSE
          fail_on_unmatched_files: true

