# Site of the seeded page tree.
#
# "rootPageId" is 1 because the seed definition declares that uid - see
# "packages-dev/dev-site/Configuration/DataFactory/academics-instance/". Declaring
# uids is the whole reason a seed may do so: without it this file could not be
# committed, because the root page would get whatever the database assigned.
#
# The base carries no host name, so the instance is reachable under its DDEV
# host name and under whatever a host stack serves it as.
#
# There is deliberately no "dependencies" list and no "settings.yaml". Site
# sets arrived in TYPO3 v13.1 and this branch also supports v12, so the
# TypoScript of the instance is delivered by the root "sys_template" record the
# seed writes, on both versions alike. The same goes for the settings: on v12 a
# site's settings are inserted before the static includes and are overwritten
# by them, so what a development instance has to correct is in the "constants"
# field of that record instead.
rootPageId: 1
base: /
websiteTitle: 'Academic extensions (TYPO3 v13)'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
    websiteTitle: ''
