# Every file relation of the seed. "uid" is the uid an entity of a scenario
# declares as its "id", and it is resolved against what the run actually wrote
# rather than trusted - a reference naming a record no entity declares is
# refused before anything is written.
#
# WHAT HAS TO BE DECLARED TWICE, AND WHAT DOES NOT
#
# A translated page and a translated profile inherit the file relation of their
# original: DataHandler writes a "sys_file_reference" row for the translation
# that this file does not declare, and declaring it anyway would produce two.
# "tt_content.assets", "tx_academicjobs_domain_model_job.image" and
# "tx_academicstudyplan_domain_model_module.audio_file" do not inherit, so the
# German variant of each of them carries its own entry - the ones at the
# original's uid plus 500.
#
# The "/legacy/" tree carries the same images as the "/" tree (ACE-460, S3-2),
# which is what lets "LegacyDeliveryTest" compare the two trees as markup rather
# than as markup with the image tags cut out of it. Its entries are the block at
# the end of this file. Only the mirrored tables appear there: the profiles, the
# jobs and everything else under "/data" exist once and are read by both trees,
# so their file relations exist once as well.
references:
  - file: profile-01
    table: tx_academicpersons_domain_model_profile
    uid: 1
    field: image
    values:
      title: 'Jane Doe'
      alternative: 'Portrait of Jane Doe'
