# The seed set the development instances are built from.
#
# Imported with "vendor/bin/typo3 data-factory:import academics-instance" in
# "core-13/" and "core-14/", which is the only way those instances get content:
# they are set up from nothing and import no example data.
#
# One set serves both core versions. Everything it declares - the backend
# layouts of bk2k/bootstrap-package, the six "academicpersons_*" CTypes, the
# felogin plugin and its FlexForm - is identical on TYPO3 v13 and v14, so a
# second set would be two definitions to keep in sync and no difference to
# express.
#
# No "files" and no "references": FAL is deliberately left out for now.
#
# No "sites" either. The site configurations of the two instances are committed
# at "core-13/config/sites/academics/" and "core-14/config/sites/academics/",
# and they carry per-instance settings the seed set has nothing to say about.
identifier: academics-instance
title: 'Academic extensions development instance'
description: >-
  The page tree, the content elements and the records of the "core-13" and
  "core-14" development instances of the fgtclb/academic-extensions mono
  repository.

scenarios:
  - Scenario.yaml
