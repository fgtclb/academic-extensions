# The seed set the development instances are built from.
#
# Imported with "vendor/bin/typo3 data-factory:import academics-instance" in
# "core-13/" and "core-14/", which is the only way those instances get content:
# they are set up from nothing and import no example data.
#
# One set serves both core versions. Everything it declares is identical on
# TYPO3 v13 and v14, so a second set would be two definitions to keep in sync
# and no difference to express.
#
# The set is written from scenario files listed under "scenarios". They are
# composed into one scenario before anything is written, so a record of one
# file may name a record of another, and "entitySettings" is declared in
# "Scenario.yaml" alone - the composer merges the files with
# ArrayUtility::mergeRecursiveWithOverrule() and every further file inherits
# them. "ScenarioLegacy.yaml", the "/legacy/" tree that is delivered through a
# root "sys_template" record instead of through site sets, is appended to that
# list.
#
# "files" and "references" live here, once, for both scenarios. A file
# reference is the one relation the scenario format cannot express: a
# "sys_file_reference" points at its file through "uid_local", and that uid is
# handed out by the FAL indexer while the file is being placed, so nobody can
# write it down in a scenario in advance.
#
# No "sites". The site configurations of the two instances are committed at
# "core-NN/config/sites/", they carry per-instance settings the seed set has
# nothing to say about, and "SiteConfigurationSeeder" refuses an identifier
# that already exists - so a seed that wrote them would fail on the second run
# of the very rebuild procedure it exists to support.
identifier: academics-instance
title: 'Academic extensions development instance'
description: >-
  The two page trees, the content elements, the shared record storage and the
  German translations of the "core-13" and "core-14" development instances of
  the fgtclb/academic-extensions mono repository.

scenarios:
  - Scenario.yaml

# The generated placeholder files, copied into "fileadmin/academics-seed/" of
# the default storage before any record is written. "FileSeeder" passes
# $removeOriginal = false, so the sources stay in this package and a rebuild
# finds them again.
