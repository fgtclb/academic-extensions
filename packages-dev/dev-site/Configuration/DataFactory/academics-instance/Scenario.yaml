  beGroup:
    #===========================================================================================================
    # The backend editor account.
    #
    # The group is the point, not the user. Core's "setup:begroups:default" writes an
    # "Editor" and an "Advanced Editor" preset, and neither of them allows a single
    # academic CType, table or page type - so a non-admin in a freshly set up
    # instance can look at the seeded content and touch none of it, which is the
    # opposite of what a development instance should demonstrate.
    #
    # "be_users.password" is written in plain text: DataHandler hashes it on save,
    # exactly as it does for a frontend user, and a pre-hashed value would pin the
    # hashing algorithm of whoever generated it into this file.
    #
    # "non_exclude_fields" is derived from the TCA rather than typed: the academic
    # extensions mark 105 columns "exclude", and a column that is excluded and not
    # listed here is invisible in the form with no error anywhere.
    #
    # "db_mountpoints" names the "/" root, the storage container and the "/legacy/"
    # root. The legacy root is declared in "ScenarioLegacy.yaml" and is named here
    # rather than there: "ScenarioComposer" appends the "entities" of the files per
    # entity name instead of merging them, so a second "beGroup" item carrying uid 10
    # would be a redeclared identifier - "LogicException" 1568146788 - and not an
    # overridden column.
    #
    # Credentials: erika-editor / Erika-Editor-1701D.
