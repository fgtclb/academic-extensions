        # One page per plugin of EXT:academic_persons.
        #
        # The FlexForm is written as the XML string DataHandler stores:
        # "checkValueForFlex()" passes a non-array value through untouched, so this is
        # exactly what a backend save produces.
        #
        # Three list pages rather than three elements on one page, because all three
        # variants read the same Extbase argument namespace "tx_academicpersons_list" -
        # two of them on one page would react to the same "currentPage" argument. The
        # card and the two selection plugins take no URL argument, so their variants
        # stack on one page.
        - self:
              id: 200
              title: 'Academic persons'
              slug: '/persons'
