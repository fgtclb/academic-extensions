# The records of the seed set "academics-instance", in the scenario format of
# sbuerk/data-factory. This file holds the "/" tree; "ScenarioLegacy.yaml"
# holds "/legacy/", and declares no "entitySettings" of its own because the two
# files are merged into one scenario before anything is built.
#
# Uids are declared throughout, and the numbering is a rule rather than a
# sequence:
#
#   pages       1 the site root, 100-199 the storage folders, 200-399 the
#               content and record pages of the "/" tree, 1000-1399 the
#               "/legacy/" tree
#   tt_content  1-499 the "/" tree, 500-999 the "/legacy/" tree
#   records     numbered from 1 per table; the four page bound tables use
#               1-199 in the "/" tree and 200-399 in "/legacy/"
#
#   and, in every table, **a German variant carries the uid of its original
#   plus 500**, so a translation is findable by arithmetic in a file this long.
#
# A declared "id" is a *suggestion* to DataHandler, honoured only for an admin
# backend user - which is why the import refuses to run as anybody else. An
# item without one is not written with an auto increment uid either: it gets a
# value from a counter that starts at 10000 and runs per entity name, so two
# entities on the same table would collide on "10000".
#
# "hidden: 0" sits on the wildcard entity and nowhere else. The "pages" TCA
# defaults the column to 1, so a page written without it exists and renders
# nothing. It must not be repeated on a declared entity: the wildcard is merged
# into each of them with array_merge_recursive(), so a key on both sides
# becomes the list [0, 0] and reaches the database as the string "Array". A
# "hidden: 1" inside a record's own "self" block is a plain overwrite and is
# safe - that is how every hidden record below is written.
#
# Every page and every translatable record carries a German variant. The site
# configurations declare "fallbackType: strict" for language 1, where a missing
# page translation is a 404 rather than a fallback, so a partially translated
# tree would be a tree with holes in it.
entitySettings:
  '*':
    nodeColumnName: 'pid'
    columnNames: {id: 'uid', language: 'sys_language_uid'}
    defaultValues: {pid: 0, hidden: 0}
  page:
    isNode: true
    tableName: 'pages'
    parentColumnName: 'pid'
    languageColumnNames: ['l10n_parent', 'l10n_source']
    # Not repeated in the wildcard: a key on both sides becomes a list. The
    # editor group seeded below owns every page of the tree except the
    # frontend user folder, which declares "perms_groupid: 0" itself.
    # "perms_userid" is not declared anywhere, so every page belongs to the
    # backend user that ran the import.
    defaultValues: {doktype: 1, perms_groupid: 10, perms_group: 31}
  content:
    tableName: 'tt_content'
    languageColumnNames: ['l18n_parent', 'l10n_source']
  beGroup:
    tableName: 'be_groups'
  beUser:
    tableName: 'be_users'
  fileMount:
    tableName: 'sys_filemounts'
  feGroup:
    tableName: 'fe_groups'
  feUser:
    tableName: 'fe_users'
  # "sys_category" and the jobs table are the only two tables here that declare
  # a "languageField" and no "translationSource". Naming "l10n_source" for them
  # anyway is not an error that is reported - the column does not exist for
  # DataHandler and the value is dropped in silence.
  category:
    tableName: 'sys_category'
    languageColumnNames: ['l10n_parent']
  job:
    tableName: 'tx_academicjobs_domain_model_job'
    languageColumnNames: ['l10n_parent']
  organisationalUnit:
    tableName: 'tx_academicpersons_domain_model_organisational_unit'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  functionType:
    tableName: 'tx_academicpersons_domain_model_function_type'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  location:
    tableName: 'tx_academicpersons_domain_model_location'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  profile:
    tableName: 'tx_academicpersons_domain_model_profile'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  contract:
    tableName: 'tx_academicpersons_domain_model_contract'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  emailAddress:
    tableName: 'tx_academicpersons_domain_model_email'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  phoneNumber:
    tableName: 'tx_academicpersons_domain_model_phone_number'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  physicalAddress:
    tableName: 'tx_academicpersons_domain_model_address'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  profileInformation:
    tableName: 'tx_academicpersons_domain_model_profile_information'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  partnerRole:
    tableName: 'tx_academicpartners_domain_model_role'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  partnership:
    tableName: 'tx_academicpartners_domain_model_partnership'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  contactRole:
    tableName: 'tx_academiccontacts4pages_domain_model_role'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  contact:
    tableName: 'tx_academiccontacts4pages_domain_model_contact'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  studyPlanCategory:
    tableName: 'tx_academicstudyplan_domain_model_category'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  semester:
    tableName: 'tx_academicstudyplan_domain_model_semester'
    languageColumnNames: ['l10n_parent', 'l10n_source']
  module:
    tableName: 'tx_academicstudyplan_domain_model_module'
    languageColumnNames: ['l10n_parent', 'l10n_source']

