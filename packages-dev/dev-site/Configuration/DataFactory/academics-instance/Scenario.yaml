      entities:
        content:
          - self:
                id: 1
                CType: 'header'
                header: 'Academic extensions development instance'
                header_layout: 1
            languageVariants:
              - self:
                    id: 501
                    language: 1
                    CType: 'header'
                    header: 'Entwicklungsinstanz der Academic Extensions'
                    header_layout: 1
          - self:
                id: 2
                CType: 'text'
                header: 'What this is'
                header_layout: 2
                bodytext: |
                  <p>A development instance of the <strong>fgtclb/academic-extensions</strong>
                  mono repository. Every page below, every content element on it and every
                  record they read is written by one seed definition, so the instance can be
                  rebuilt from nothing instead of being clicked together by hand.</p>
                  <p>One branch per extension, with one page per plugin variant. The shared
                  record storage sits under <a href="t3://page?uid=100">Data</a> and is read by
                  both page trees of this installation.</p>
            languageVariants:
              - self:
                    id: 502
                    language: 1
                    CType: 'text'
                    header: 'Worum es geht'
                    header_layout: 2
                    bodytext: |
                      <p>Eine Entwicklungsinstanz des Monorepos
                      <strong>fgtclb/academic-extensions</strong>. Jede Seite, jedes Inhaltselement
                      und jeder Datensatz stammt aus einer Seed-Definition, damit die Instanz aus
                      dem Nichts neu aufgebaut statt von Hand zusammengeklickt wird.</p>
                      <p>Ein Zweig je Extension, mit einer Seite je Plugin-Variante. Der gemeinsame
                      Datenspeicher liegt unter <a href="t3://page?uid=100">Daten</a> und wird von
                      beiden Seitenbäumen dieser Installation gelesen.</p>
          # "assets" is written by the "references" block of config.yml: a file
          # relation cannot be expressed in a scenario file, because the uid of the
          # sys_file row is handed out by the FAL indexer while the file is placed.
          - self:
                id: 3
                CType: 'textmedia'
                header: 'Seeded assets'
                header_layout: 2
                bodytext: |
                  <p>The images of this instance are generated placeholders. Each one draws
                  its own name and its pixel dimensions, so a wrong reference is visible
                  without opening the record.</p>
                imageorient: 8
                imagewidth: 600
            languageVariants:
              - self:
                    id: 503
                    language: 1
                    CType: 'textmedia'
                    header: 'Bilder aus dem Seed'
                    header_layout: 2
                    bodytext: |
                      <p>The images of this instance are generated placeholders. Each one draws
                      its own name and its pixel dimensions, so a wrong reference is visible
                      without opening the record.</p>
                    imageorient: 8
                    imagewidth: 600
      children:
        # The shared record storage.
        #
        # Roughly fifteen of the seeded tables are addressed by storage pid - a
        # "persistence.storagePid" site setting or a "tt_content.pages" list - so they
        # exist once, here, and both page trees read them. The four that are addressed
        # by a page or a content element pointer cannot be shared and live with the
        # page that owns them: contacts, partnerships, study plan semesters and, through
        # their semester, study plan modules.
        #
        # The folders are children of a page inside the site rather than a second top
        # level branch. A top level page that is not a configured site root makes TYPO3
        # write "config/sites/autogenerated-*", and that generated site then claims the
        # branch and answers 404 for everything below it.
