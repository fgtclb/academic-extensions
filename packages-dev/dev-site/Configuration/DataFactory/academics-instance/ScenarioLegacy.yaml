# The "/legacy/" tree of the seed set "academics-instance".
#
# GENERATED FILE. Written by "Build/Scripts/generateLegacyScenario.php" from
# "Scenario.yaml" - edit that file and run the script, never this one.
#
# "Scenario.yaml" holds the "/" tree, which is delivered through site sets. This
# file holds a full mirror of it below a second site root, delivered through a
# root "sys_template" record and page "tsconfig_includes" instead - the way an
# installation that predates site sets is configured, and the only way the two
# delivery mechanisms can be compared page for page.
#
# The two files are composed into one scenario before anything is written:
# "ScenarioComposer" merges the "entitySettings" and appends the "entities" per
# entity name, in the order "config.yml" lists the files. A record here may
# therefore name a record of the other file, and does, for the shared storage.
#
# WHAT IS MIRRORED, AND WHAT IS SHARED
#
# The mirror is the page tree, and only the page tree. Roughly fifteen of the
# seeded tables are addressed by a storage pid - a "persistence.storagePid"
# constant or a "tt_content.pages" list - so they exist once, under "/data" of
# the "/" tree, and every plugin below names those pids. Four tables cannot be
# shared, because the code that reads them selects by a page or by a content
# element rather than by a storage pid, so they are duplicated with the page
# that owns them:
#
#   tx_academiccontacts4pages_domain_model_contact  selected by "page"
#   tx_academicpartners_domain_model_partnership    selected by "page"
#   tx_academicstudyplan_domain_model_semester      selected by "content_element"
#   tx_academicstudyplan_domain_model_module        selected by its semester
#
# The storage folders of "/data" are not mirrored at all. Mirroring a folder
# whose records are shared leaves an empty folder in the backend that looks like
# it should hold something, so "/" has 65 pages and "/legacy/" has 56.
#
# UIDS
#
#   pages       the uid of the mirrored page plus 1000, so 1 -> 1001 and
#               345 -> 1345 - the whole tree lives in 1000-1399, with
#               1100-1199 unused because the storage folders are not
#               mirrored
#   tt_content  the uid of the mirrored element plus 1000, so 1 -> 1001
#   the four    the uid of the mirrored record plus 200, so 1 -> 201
#   duplicated
#   tables
#
# and, as in "Scenario.yaml", a German variant carries the uid of its original
# plus 500 - which the offsets above preserve: page 501, the German variant of
# page 1, becomes 1501, and 1501 is 1001 plus 500.
#
# A note on the ranges: the header of "Scenario.yaml" reserves "tt_content"
# 500-999 for this tree. It cannot have it - the German variants of the 63
# elements of the "/" tree occupy 501-563 under the plus-500 rule, and that rule
# wins. This tree takes the 1000 block in "tt_content" as well, which is also
# what makes the two tables read alike: the legacy tree is the 1000 block.
#
# Everything else - the shared storage pids, "sys_category" uid lists, contract
# and role uids - is written unchanged, because it points into the shared
# storage on purpose.
#
# This file carries almost no prose, and that is a property of being generated
# rather than an omission: the parser discards comments, so the explanation of a
# mirrored page is in "Scenario.yaml", at its uid minus 1000.

entitySettings:
  # The only entity this file adds. It does not repeat the forty lines
  # "Scenario.yaml" declares: "ScenarioComposer" merges the "entitySettings" of
  # the files before the factory is built, so every entity of that file is in
  # force here - and the "*" wildcard is merged into this entry as well, which
  # is where "pid", "id" -> "uid" and the default values come from.
  template:
    tableName: 'sys_template'

entities:
  page:
    # The second site root. It is a top level page and not a branch of page 1: a
    # site with the base "/legacy/" needs a root page of its own, and
    # "core-NN/config/sites/academics-legacy/" is committed and therefore read
    # before the import runs, so TYPO3 writes no "config/sites/autogenerated-*"
    # for it and answers no 404 below it.
    #
    # Its slugs are those of the mirrored pages, unchanged. Slug uniqueness is
    # evaluated per site ("uniqueInSite") and this page is a site of its own, so
    # "/persons/list" exists twice without either being renamed - which is what
    # makes a page of one tree findable from the other by prefixing "/legacy".
    - self:
          id: 1001
          title: 'Academic extensions (legacy delivery)'
          slug: '/'
          is_siteroot: 1
          doktype: 1
          backend_layout: 'pagets__special_start'
          backend_layout_next_level: 'pagets__default'
          tsconfig_includes: 'EXT:academic_base/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_bite_jobs/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_contacts4pages/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_jobs/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_partners/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_persons/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_persons_edit/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_programs/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_projects/Configuration/TSconfig/Full/page.tsconfig,EXT:academic_study_plan/Configuration/TSconfig/Full/page.tsconfig'
      languageVariants:
        - self:
              id: 1501
              language: 1
              title: 'Academic Extensions (klassische Auslieferung)'
              slug: '/'
              doktype: 1
              backend_layout: 'pagets__special_start'
              backend_layout_next_level: 'pagets__default'
      entities:
        template:
          - self:
                id: 1
                title: 'Academic extensions (static template delivery)'
                root: 1
                clear: 3
                include_static_file: 'EXT:fluid_styled_content/Configuration/TypoScript,EXT:academics_dev_site/Configuration/TypoScript,EXT:academic_persons/Configuration/TypoScript/Full,EXT:academic_persons_edit/Configuration/TypoScript/Full,EXT:academic_contacts4pages/Configuration/TypoScript/Full,EXT:academic_jobs/Configuration/TypoScript/Full,EXT:academic_bite_jobs/Configuration/TypoScript/Full,EXT:academic_partners/Configuration/TypoScript/Full,EXT:academic_programs/Configuration/TypoScript/Full,EXT:academic_projects/Configuration/TypoScript/Full,EXT:academic_study_plan/Configuration/TypoScript/Full'
                constants: |
                  # What "config/sites/academics/settings.yaml" says through site settings, said
                  # here the way a site without site sets says it - with the page uids of this
                  # tree, so a list of this tree links to the detail page of this tree.
                  #
                  # The two "page.theme.*" settings of that file have no counterpart here: they
                  # belong to EXT:bootstrap_package, and this tree is not themed by it - see the
                  # "include_static_file" above.
                  plugin.tx_academicpersons {
                      detailPid = 1205
                      demand.sortBy = lastName
                      demand.sortByDirection = asc
                      pagination.resultsPerPage = 10
                  }

                  plugin.tx_academicjobs {
                      persistence.storagePid = 120
                      detailPid = 1233
                      listPid = 1231
                      saveForm.fallbackRedirectPageId = 1235
                      email.from = seed-noreply@example.org
                      email.recipientEmail = jobs@example.org
                  }
        content:
          - self:
                id: 1001
                CType: 'header'
                header: 'Academic extensions development instance'
                header_layout: 1
            languageVariants:
              - self:
                    id: 1501
                    language: 1
                    CType: 'header'
                    header: 'Entwicklungsinstanz der Academic Extensions'
                    header_layout: 1
          - self:
                id: 1002
                CType: 'text'
                header: 'What this is'
                header_layout: 2
                bodytext: |
                  <p>A development instance of the <strong>fgtclb/academic-extensions</strong>
                  mono repository. Every page below, every content element on it and every
                  record they read is written by one seed definition, so the instance can be
                  rebuilt from nothing instead of being clicked together by hand.</p>
                  <p>One branch per extension, with one page per plugin variant. The shared
                  record storage sits under <a href="t3://page?uid=100">Data</a> and is read by
                  both page trees of this installation.</p>
            languageVariants:
              - self:
                    id: 1502
                    language: 1
                    CType: 'text'
                    header: 'Worum es geht'
                    header_layout: 2
                    bodytext: |
                      <p>Eine Entwicklungsinstanz des Monorepos
                      <strong>fgtclb/academic-extensions</strong>. Jede Seite, jedes Inhaltselement
                      und jeder Datensatz stammt aus einer Seed-Definition, damit die Instanz aus
                      dem Nichts neu aufgebaut statt von Hand zusammengeklickt wird.</p>
                      <p>Ein Zweig je Extension, mit einer Seite je Plugin-Variante. Der gemeinsame
                      Datenspeicher liegt unter <a href="t3://page?uid=100">Daten</a> und wird von
                      beiden Seitenbäumen dieser Installation gelesen.</p>
          - self:
                id: 1003
                CType: 'textmedia'
                header: 'Seeded assets'
                header_layout: 2
                bodytext: |
                  <p>The images of this instance are generated placeholders. Each one draws
                  its own name and its pixel dimensions, so a wrong reference is visible
