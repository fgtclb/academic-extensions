# The route enhancers of the academic extensions.
#
# None of the five files is loaded by TYPO3 on its own - a "Routes.yaml" or a
# "Configuration/Routes/*.yaml" is inert until a site configuration imports it -
# so without this block every detail page below is reachable only through a raw
# "tx_...[...]" argument, and half of the seeded tree looks broken for a reason
# that is not the seed.
#
# Imported here rather than carried by a site set: a set may ship a
# "route-enhancers.yaml" only from TYPO3 v14.1, and this branch supports v13 as
# well, so "imports" is the form that works on both.
imports:
  - resource: 'EXT:academic_persons/Configuration/Routes/List.yaml'
  - resource: 'EXT:academic_persons/Configuration/Routes/ListAndDetail.yaml'
  - resource: 'EXT:academic_persons/Configuration/Routes/Detail.yaml'
  - resource: 'EXT:academic_jobs/Configuration/Routes/Detail.yaml'
  - resource: 'EXT:academic_programs/Configuration/Yaml/Routes.yaml'

# Site of the "/legacy/" page tree - the 56 content pages of "academics",
# delivered the way an installation that predates site sets delivers them. The
# nine storage folders of "/data" are not mirrored: their records are shared,
# and both trees read them from where they are.
#
# "rootPageId" is 1001 because "ScenarioLegacy.yaml" declares that uid. This
# file is committed and is read before the seed runs, which is what keeps TYPO3
# from writing a "config/sites/autogenerated-*" for a new top level page and
# answering 404 for everything below it.
#
# The base ends with a slash. Sites are matched by path specificity, so
# "/legacy/" wins over the "/" of the "academics" site - but only with the
# trailing slash, without which "/legacyfoo" would match as well.
rootPageId: 1001
base: /legacy/
websiteTitle: 'Academic extensions, legacy delivery (TYPO3 v14)'

# No "dependencies". That is the whole point of this site: every line of
# TypoScript it renders from arrives through the "include_static_file" column of
# the root "sys_template" record on page 1001, and its page TSconfig through the
# "tsconfig_includes" column of that page - both declared by
# "ScenarioLegacy.yaml". A site set named here would deliver the same TypoScript
# a second time and the comparison with the "academics" site would prove
# nothing.
#
# There is no "settings.yaml" next to this file for the same reason. What
# "config/sites/academics/settings.yaml" says through site settings, this site
# says through the "constants" field of that "sys_template" record - with the
# page uids of this tree, so a list here links to the detail page of this tree
# and not out of it.
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
    websiteTitle: ''
  # "fallbackType: strict" - a page without a translation is a 404 in "/de/",
  # not the English page served under a German URL. That is the setting the seed
  # is written for: every page and every translatable record it declares carries
  # its German variant, so a hole in "/de/" is a defect in the seed and shows up
  # as one instead of being papered over by the default language.
  -
    title: German
    enabled: true
    languageId: 1
    base: /de/
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    fallbackType: strict
    fallbacks: ''
    websiteTitle: ''
